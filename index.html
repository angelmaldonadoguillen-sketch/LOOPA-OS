  display: flex; align-items: center; justify-content: center;
}
.pay-opt.on .radio { border-color: var(--accent); }
.pay-opt.on .radio::after { content: ""; width: 8px; height: 8px; background: var(--accent); }
.pay-opt .l {
  font-family: var(--font-display); font-weight: 500; font-size: var(--fs-m);
}
.pay-opt .s {
  font-family: var(--font-mono); font-size: var(--fs-s); color: var(--muted); letter-spacing: 0.08em;
  text-transform: uppercase;
}
.filterbar {
  display: flex; align-items: center; gap: 10px; padding: 0 0 16px;
  flex-wrap: wrap;
}
.filter-group {
  display: flex; align-items: center; gap: 6px;
  border: 1px solid var(--line);
  padding: 6px 10px;
  background: var(--surface);
}
.filter-group .flabel {
  font-family: var(--font-mono); font-size: var(--fs-s); letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--muted);
}
.filter-group select {
  background: transparent; border: 0; color: var(--text); font-family: var(--font-mono);
  font-size: var(--fs-s); padding: 2px 4px; outline: none;
}
.filter-group select option {
  background: #20201f; color: #e6e6e2;
}
.metrics-grid {
  display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px;
}
.metrics-grid-2 {
  display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
}
.top-list { padding: 0; }
.top-row {
  display: grid; grid-template-columns: 32px 36px 1fr auto; gap: 12px;
  align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line);
}
.top-row:last-child { border-bottom: 0; }
.top-row .rank {
  font-family: var(--font-display); font-weight: 500; font-size: var(--fs-l);
  color: var(--accent); letter-spacing: -0.03em;
}
.top-row .th { width: 36px; height: 36px; background: #0e0e0d; border: 1px solid var(--line); overflow: hidden; flex-shrink: 0; }
.top-row .nm { font-family: var(--font-display); font-weight: 500; font-size: var(--fs-m); }
.top-row .snm { font-family: var(--font-mono); font-size: var(--fs-s); color: var(--muted); }
.top-row .v { font-family: var(--font-mono); font-size: var(--fs-m); font-weight: 500; }
.channel-row {
  display: grid; grid-template-columns: 120px 1fr auto; gap: 14px;
  align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line);
}
.channel-row:last-child { border-bottom: 0; }
.channel-row .ch {
  font-family: var(--font-mono); font-size: var(--fs-s); letter-spacing: 0.1em;
  text-transform: uppercase;
}
.channel-row .trk {
  height: 8px; background: #0e0e0d; position: relative;
}
.channel-row .trk span {
  position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent);
}
.channel-row .v { font-family: var(--font-mono); font-size: var(--fs-s); font-weight: 500; }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.accent { color: var(--accent); }
.flex { display: flex; }
.nowrap { white-space: nowrap; }
hr.divider { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
.ticker {
  height: 34px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 24px;
  font-family: var(--font-body);
  font-size: var(--fs-s);
  letter-spacing: 0.01em;
  color: var(--muted);
  gap: 26px;
  background: #0c0c0b;
  overflow: hidden;
  white-space: nowrap;
  flex-shrink: 0;
}
.ticker .item { display: inline-flex; gap: 10px; align-items: center; }
.ticker .item .v { color: var(--text); }
.nav-mobile-label { display: none; font-size: var(--fs-s); line-height: 1; letter-spacing: 0.04em; }
.topbar-mobile-title { display: none; font-family: var(--font-display); font-weight: 500; font-size: var(--fs-m); letter-spacing: -0.01em; }
.mob-hide { display: inline-flex; }
@media (max-width: 900px) {
.app { grid-template-columns: 64px 1fr; }
}
@media (max-width: 640px) {
.app {
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: 1fr 60px;
    height: 100vh;
    height: 100dvh;
  }
.main {
    order: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
.content {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 14px 24px;
  }
.sidebar {
    order: 2;
    flex-direction: row;
    height: 60px;
    min-height: 60px;
    border-right: none;
    border-top: 1px solid var(--line);
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
.sidebar::-webkit-scrollbar { display: none; }
.sidebar-brand { display: none !important; }
.nav {
    flex-direction: row;
    padding: 0;
    flex: 1;
    gap: 0;
    min-width: 0;
  }
.nav-item {
    flex: 1;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 6px 4px 4px;
    gap: 4px;
    font-size: var(--fs-s);
    min-width: 52px;
    border-radius: 0;
    letter-spacing: 0.02em;
  }
.nav-item .num { display: none; }
.nav-item > span:not(.nav-mobile-label) { display: none; }
.nav-mobile-label { display: block; }
.nav-item.active::before {
    content: "";
    position: absolute;
    top: 0; left: 10%; right: 10%; bottom: auto;
    width: auto; height: 2px;
    background: var(--accent);
  }
.ticker { display: none; }
.topbar {
    height: 48px;
    min-height: 48px;
    padding: 0 14px;
    flex-shrink: 0;
  }
.breadcrumb { display: none; }
.topbar-mobile-title { display: block; }
.mob-hide { display: none !important; }
.page-head {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    padding-bottom: 18px;
    margin-bottom: 20px;
  }
.page-title { font-size: var(--fs-l); }
.page-desc { font-size: var(--fs-s); }
.panel-body { padding: 14px; }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tbl th, .tbl td { padding: 8px 10px; font-size: var(--fs-s); white-space: nowrap; }
.kpi-grid { grid-template-columns: repeat(2, 1fr) !important; }
.metrics-grid, .metrics-grid-2 { grid-template-columns: 1fr !important; }
.filterbar { gap: 8px; padding: 10px 14px; flex-wrap: wrap; }
.filter-group { min-width: 120px; }
}
@media (max-width: 400px) {
.nav-item { min-width: 44px; padding: 6px 2px 4px; }
.nav-mobile-label { font-size: var(--fs-s); }
.content { padding: 12px 10px 20px; }
.page-title { font-size: var(--fs-l); }
.panel-body { padding: 12px; }
}

:root {
  --bg: #121211; --surface: #171716; --card: #1b1b1a; --card-2: #20201f;
  --line: #2a2a28; --line-2: #343432;
  --text: #f4f4f1; --muted: #9a9a95; --dim: #63635f;
  --accent-rgb: 244,244,241;
  --on-accent: #121211;               
  --font-display: 'Manrope', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --font-body: 'Manrope', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --font-mono: 'Manrope', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --fs-s: 12px;   
  --fs-m: 14px;   
  --fs-l: 30px;   
}
html, body { font-size: var(--fs-m); }
b, strong { font-weight: 500; }
.mono, .tbl .num { font-variant-numeric: tabular-nums; }
::selection { background: var(--accent); color: var(--on-accent); }
.step { text-align: left; cursor: pointer; }
.btn { white-space: nowrap; }
.btn.primary, .btn.primary:hover { color: var(--on-accent); }
.bell-badge { color: var(--on-accent); }
.segmented button.on, .chipbtn.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.step:hover:not(.active) { background: #1a1a19; }
.order-hero { background: #0c0c0b; border-color: var(--accent); }
.order-hero::before { content: "LOOPA"; color: rgba(var(--accent-rgb), .06); }
.kpi.accent { color: var(--on-accent); }
.kpi.accent .label, .kpi.accent .unit, .kpi.accent .delta { color: rgba(18,18,17,.65); }
.sidebar-brand { padding: 14px 18px 10px; }
.kpi .value { font-size: var(--fs-l); flex-wrap: wrap; }
.kpi-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
@media (max-width: 1200px) {
.kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
.badge.e-pendiente { color: #9a9a95; border-color: #383836; }
.badge.e-pendiente .pip { background: #9a9a95; }
.badge.e-en-proceso { color: #E8B547; border-color: #5c4516; }
.badge.e-en-proceso .pip { background: #E8B547; }
.badge.e-revision { color: #6BA3E0; border-color: #2a4660; }
.badge.e-revision .pip { background: #6BA3E0; }
.badge.e-entregado { color: #7BC96F; border-color: #2e5228; }
.badge.e-entregado .pip { background: #7BC96F; }
.badge.e-cancelado { color: #5a5a56; border-color: #2e2e2c; text-decoration: line-through; }
.badge.e-cancelado .pip { background: #5a5a56; }
.pay.partial { color: var(--info); }
.tbl .num, .tbl .pay { white-space: nowrap; }
.input.mini, .select.mini { padding: 8px 10px; font-size: var(--fs-s); }
.mini-lbl { display: block; font-family: var(--font-mono); font-size: var(--fs-s); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-bottom: 5px; }
.fg-input { background: transparent; border: 0; color: var(--text); font-family: var(--font-mono); font-size: var(--fs-s); outline: none; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.linkbtn { color: var(--accent); font-family: var(--font-mono); font-size: var(--fs-s); letter-spacing: .08em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 5px; padding: 2px 0; }
.linkbtn:hover { text-decoration: underline; }
.icon-btn { width: 26px; height: 26px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; color: var(--dim); border: 1px solid transparent; flex-shrink: 0; }
.icon-btn:hover { background: #252524; color: var(--text); border-color: var(--line-2); }
.icon-btn.danger:hover { color: var(--danger); border-color: #4a1a1f; background: rgba(230,57,70,.08); }
.icon-btn:disabled { opacity: .3; pointer-events: none; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }

.srv-chip { display: inline-block; font-family: var(--font-mono); font-size: var(--fs-s); letter-spacing: .04em; color: var(--muted); border: 1px solid var(--line-2); border-radius: 6px; padding: 2px 7px; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }

.service-model.unitario { color: var(--muted); }
.service-model.proyecto { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.service-model.especial, .service-special-client { color: var(--accent); border-color: rgba(var(--accent-rgb), .45); }
.service-recommended { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 500; }
.service-model-cell { min-width: 190px; max-width: 240px; }
.segmented button:disabled { opacity: .35; cursor: not-allowed; }
.tag-edit { display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px 4px 12px; border: 1px solid var(--line-2); border-radius: 999px; font-size: var(--fs-s); }

.search-big { display: flex; align-items: center; gap: 10px; background: #0e0e0d; border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 0 8px 0 14px; color: var(--muted); transition: border-color .15s, box-shadow .15s; }

.search-big input::placeholder { color: var(--dim); }
.dropdown { position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px; background: #181817; border: 1px solid var(--accent); border-radius: var(--r-md); z-index: 200; overflow: hidden; max-height: 340px; overflow-y: auto; box-shadow: 0 12px 40px rgba(0,0,0,.7); }
.dropdown-row { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; }
.dropdown-row:last-child { border-bottom: 0; }
.dropdown-row:hover { background: #20201f; }
.dropdown-lbl { font-family: var(--font-mono); font-size: var(--fs-s); letter-spacing: .14em; color: var(--dim); padding: 6px 12px; border-bottom: 1px solid var(--line); text-transform: uppercase; background: #0e0e0d; }
.gsearch-wrap { padding: 8px 12px; border-bottom: 1px solid var(--line); position: relative; }
.gsearch { display: flex; align-items: center; gap: 7px; background: #171716; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 7px 10px; color: var(--dim); }
.gsearch.on { border-color: var(--accent); }
.gsearch input { background: transparent; border: 0; color: var(--text); font-family: var(--font-mono); font-size: var(--fs-s); outline: none; width: 100%; }
.nv-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr); gap: 20px; align-items: start; }
.sticky-panel { position: sticky; top: 0; }
.srv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.srv-card { position: relative; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 6px; min-height: 112px; transition: border-color .12s, background .12s, transform .08s; }
.srv-card:hover { border-color: rgba(var(--accent-rgb), .7); background: var(--card); }
.srv-card:active { transform: scale(.98); }
.srv-card.on { border-color: var(--accent); background: rgba(var(--accent-rgb), .06); }
.srv-card.new { border-style: dashed; border-color: var(--accent); background: rgba(var(--accent-rgb), .05); }
.srv-cat { font-family: var(--font-mono); font-size: var(--fs-s); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); padding-right: 26px; }
.srv-name { font-family: var(--font-display); font-weight: 500; font-size: var(--fs-m); line-height: 1.25; letter-spacing: -.01em; overflow-wrap: anywhere; }

.srv-in { position: absolute; top: 10px; right: 10px; background: var(--accent); color: var(--on-accent); font-family: var(--font-mono); font-size: var(--fs-s); font-weight: 500; border-radius: 999px; min-width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; padding: 0 6px; }

.ln-foot { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: var(--r-sm); overflow: hidden; background: #0e0e0d; }

.pr-portal-tarea { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.pr-portal-tit { display: flex; justify-content: space-between; gap: 10px; font-size: var(--fs-s); }
.pr-fases { display: flex; gap: 3px; }
.pr-fases > span { flex: 1; height: 4px; border-radius: 2px; background: var(--line-2); }
.pr-fases > span.hecha { background: var(--muted); }
.pr-fases > span.actual { background: var(--text); }
button.pr-barra-label { background: none; padding: 0; text-align: left; font-size: var(--fs-s); }
.nav-grupo { font-size: var(--fs-s); color: var(--dim); letter-spacing: 0.14em; text-transform: uppercase; padding: 14px 12px 4px; }
.nav-agrupada .nav-grupo:first-child { padding-top: 4px; }
.nav-mas { display: none; }
.nav-mas-fondo { position: fixed; top: 0; left: 0; right: 0; bottom: 60px; background: rgba(0, 0, 0, 0.45); z-index: 2500; display: flex; align-items: flex-end; }
.nav-mas-hoja { width: 100%; background: var(--surface); border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.nav-mas-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; font-size: var(--fs-m); color: var(--text); background: transparent; border-radius: 10px; text-align: left; }
.nav-mas-item.on { background: rgba(var(--accent-rgb), 0.1); }
@media (max-width: 900px) {
.nav-grupo { display: none; }
}
@media (max-width: 640px) {
.nav-agrupada .nav-secundario { display: none; }
.nav-agrupada .nav-mas { display: flex; }
}
.content.content-frame { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
.frame-embebido { flex: 1; min-height: 0; height: 100%; }
.frame-embebido iframe { display: block; width: 100%; height: 100%; border: 0; background: #131315; }

<script type="text/babel" data-presets="react">
// ── módulo: datos/fusion.js ──
// ═══════════════════════════════════════════════════════════════
// LOOPA OS · Datos de la fusión (Fase 3, tanda 3.2)
//
// Traductor PURO entre las pantallas de LOOPA (ventas, clientes y servicios
// con la forma vieja) y el modelo unificado de frame-studio-3a18f:
//
//   leer:     documentos (loopa_sales, frame_clients, loopa_services)
//             → la forma que ya usan las pantallas
//   escribir: lo que hace la pantalla (crear venta, cambiar estado, editar
//             líneas, cobrar, anular un cobro, «eliminar»)
//             → llamadas a las funciones del servidor
//
// Sin Firebase, sin DOM: se prueba con Node (integracion/test/fusion-datos).
// Nada se escribe directo en Firestore: todo pasa por el servidor.
// La lectura es la misma que functions/migration/compat.js (paridad probada).
// ═══════════════════════════════════════════════════════════════

const LoopaFusion = (function () {
  const UNCATALOGUED_SERVICE_ID = 'SRV-SIN-CATALOGO';
  const LEGACY_LOG = { confirmed: 'pendiente', cancelled: 'cancelado' };
  const AVANCE = ['pendiente', 'en-proceso', 'revision', 'entregado'];
  const num = (v) => { const n = Number(String(v ?? '').replace(/,/g, '')); return Number.isFinite(n) ? n : 0; };
  const txt = (v) => (typeof v === 'string' ? v.trim() : '');

  // ── Lectura ────────────────────────────────────────────────────
  // Un borrador no existe en las pantallas viejas: null.
  function ventaDesdeDoc(doc) {
    if (!doc || doc.status === 'draft') return null;
    const c = doc.commercial || {};
    const estado = doc.status === 'cancelled' ? 'cancelado' : (doc.legacyProductionState || 'pendiente');
    return {
      id: doc.id,
      n: doc.n,
      // Para la concurrencia optimista al editar (expectedVersion).
      version: doc.version,
      fecha: doc.fecha,
      cliente: doc.client.nombre,
      empresa: doc.client.empresa || '',
      telefono: (c.contacto && c.contacto.telefono) || '',
      email: (c.contacto && c.contacto.email) || '',
      canal: c.canal || '',
      clienteId: doc.client.clientId,
      items: doc.lines.map(line => ({
        lineId: line.lineId,
        tipoId: line.serviceId === UNCATALOGUED_SERVICE_ID ? '' : line.serviceId,
        nombre: line.snapshot.nombre,
        categoria: line.snapshot.categoria || '',
        unidad: line.snapshot.unidad || '',
        descripcion: line.snapshot.alcance || '',
        modelo: line.snapshot.modelo,
        precio: line.snapshot.precio,
        costo: line.snapshot.costo,
        recomendado: line.snapshot.recomendado === true,
        clienteIdEspecial: line.snapshot.specialClientId || '',
        q: line.quantity,
      })),
      subtotal: c.subtotal || 0,
      descuento: c.descuento || 0,
      total: c.total || 0,
      pay: c.pay || '',
      abonos: (c.abonos || []).map(a => ({ id: a.id, fecha: a.fecha, monto: a.monto, metodo: a.metodo })),
      estado,
      entrega: doc.entrega || '',
      nota: c.nota || '',
      creado: doc.createdAt || '',
      estadoLog: (doc.estadoLog || [])
        .filter(e => e.estado !== 'draft')
        .map(e => ({ ...e, estado: LEGACY_LOG[e.estado] || e.estado })),
      // Avance real de producción (lo lleva FRAME): para mostrarlo al lado.
      produccion: doc.operations ? { status: doc.operations.status, tareas: (doc.operations.taskIds || []).length } : null,
    };
  }

  function clienteDesdeDoc(doc) {
    const k = doc.commercial || {};
    const pick = (a, b) => (a && !/^[\s—–-]*$/.test(a) ? a : b || '');
    return {
      id: doc.id,
      nombre: k.nombreLoopa || doc.name,
      empresa: k.empresa || '',
      telefono: pick(k.telefono, doc.contact && doc.contact.phone !== '—' ? doc.contact.phone : ''),
      email: pick(k.email, doc.contact && doc.contact.email !== '—' ? doc.contact.email : ''),
      canal: k.canal || '',
      notas: k.notas || '',
      creado: k.creadoEnLoopa || '',
    };
  }

  function servicioDesdeDoc(doc) {
    return {
      id: doc.id,
      nombre: doc.nombre,
      categoria: doc.categoria,
      unidad: doc.unidad,
      precio: doc.precio,
      costo: doc.costo,
      descripcion: doc.descripcion,
      activo: doc.activo,
      creado: doc.createdAt || '',
      modelo: doc.modelo,
      recomendado: doc.recomendado,
      clienteIdEspecial: doc.specialClientId || '',
      // ¿Genera producción al venderse? (tiene plantilla activa)
      generaProduccion: !!(doc.executionPlan && doc.executionPlan.enabled),
    };
  }

  // ── Escritura: qué funciones del servidor llamar ───────────────
  // Cada operación es { fn, data }; el que llama las ejecuta en orden.
  // Una línea migrada sin servicio del catálogo (tipoId vacío) conserva su
  // servicio marcador: se puede editar su cantidad o precio. Una línea NUEVA
  // siempre viene del catálogo.
  const lineaDesdeItem = (i, nuevoId) => ({
    lineId: i.lineId || nuevoId(),
    serviceId: i.tipoId || (i.lineId ? UNCATALOGUED_SERVICE_ID : ''),
    quantity: num(i.q),
    precio: num(i.precio),
    costo: num(i.costo),
    ...(typeof i.descripcion === 'string' ? { descripcion: i.descripcion } : {}),
  });

  const clienteParaServidor = (cli, id) => ({
    id, nombre: txt(cli.nombre), empresa: txt(cli.empresa), telefono: txt(cli.telefono), email: txt(cli.email), canal: txt(cli.canal),
    ...(Object.prototype.hasOwnProperty.call(cli, 'notas') ? { notas: txt(cli.notas) } : {}),
  });

  function resumenActividad(antes, despues, columnas) {
    const etiqueta = (s) => { const c = (columnas || []).find(x => x.id === s) || P.STATUSES.find(x => x.id === s); return c ? c.label : s; };
    if (antes.status !== despues.status) return `cambió el estado a ${etiqueta(despues.status)}`;
    if (antes.startDate !== despues.startDate) return 'reprogramó la fecha de inicio';
    if (antes.deadline !== despues.deadline) return 'cambió la fecha límite';
    if (antes.sessionDate !== despues.sessionDate) return 'reprogramó la próxima fecha de trabajo';
    if (!igual(antes.assignees, despues.assignees)) return 'actualizó los responsables';
    if (!igual(antes.checklist, despues.checklist)) return 'actualizó el checklist';
    return null;
  }

  // Las reglas sólo aceptan poner clientId si la tarea NUNCA tuvo el campo
  // (ni vacío) y la ficha es del mismo tablero principal de la tarea.
  const puedeEnlazar = (crudo, wsId) => !!crudo && !Object.prototype.hasOwnProperty.call(crudo, 'clientId') && crudo.workspaceId === wsId;

  // Enlazar (linkTaskToClient): sólo clientId.
  function parcheEnlace(antes, despues) {
    return !antes.clientId && despues.clientId ? { clientId: despues.clientId } : {};
  }

  return { EDITABLES, hoyEnTegucigalpa, fechaEnRango, tareasDelTablero, columnasDe, equipoDe, armarProduccion, parcheTarea, resumenActividad, puedeEnlazar, parcheEnlace };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = LoopaProduccionReal;

// ── módulo: produccion/calendario.jsx ──
// ═══════════════════════════════════════════════════════════════
// LOOPA OS · Producción — calendario (Fase 2, tanda 1)
//
// Vista de SÓLO LECTURA del trabajo del equipo, con la identidad de LOOPA.
// La lógica (qué día va cada tarea, urgencias, progreso) sale del núcleo
// portado de FRAME (nucleo.js), verificado con pruebas de paridad.
//
// Bandera (se recuerda en este navegador):
//   ?produccion=demo   datos de ejemplo generados por el planificador
//   ?produccion=1      datos reales (se conectan en la Fase 3)
//   ?produccion=0      apaga el módulo (también off / false / no)
// Cualquier otro valor se ignora. Sin bandera, el módulo no aparece.
// ═══════════════════════════════════════════════════════════════

const PROD_FLAG = (() => {
  try {
    const q = new URLSearchParams(window.location.search).get('produccion');
    if (q !== null) {
      const v = q.trim().toLowerCase();
      const on = v === 'demo' ? 'demo' : (v === '' || v === '1') ? '1' : null;
      const off = ['0', 'off', 'false', 'no'].includes(v);
      if (on) window.localStorage.setItem('loopa-flag-produccion', on);
      else if (off) window.localStorage.setItem('loopa-flag-produccion', '0');
    }
    const stored = window.localStorage.getItem('loopa-flag-produccion');
    return stored === 'demo' || stored === '1' ? stored : null;
  } catch (e) {
    return null;
  }
})();

const PROD_DIAS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
const prodCapital = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const prodFecha = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const prodMesLabel = (y, m) => prodCapital(new Date(y, m, 1).toLocaleDateString('es-HN', { month: 'long', year: 'numeric' }));
const prodDiaLabel = (iso) => (LoopaProduccion.isDay(iso)
  ? prodCapital(prodFecha(iso).toLocaleDateString('es-HN', { weekday: 'long', day: 'numeric', month: 'long' }))
  : `Fecha inválida (${iso})`);
const prodCorto = (iso, conAnio = false) => (LoopaProduccion.isDay(iso)
  ? prodFecha(iso).toLocaleDateString('es-HN', conAnio ? { day: 'numeric', month: 'short', year: 'numeric' } : { day: '2-digit', month: 'short' })
  : iso);
const prodSemanaLabel = (dias) => {
  const a = dias[0], b = dias[6];
  return a.slice(0, 4) === b.slice(0, 4)
    ? `${prodCorto(a)} – ${prodCorto(b)}, ${a.slice(0, 4)}`
    : `${prodCorto(a, true)} – ${prodCorto(b, true)}`;
};

function prodEstadoLabel(status, columnas) {
  const c = (columnas || []).find(x => x.id === status) || LoopaProduccion.STATUSES.find(x => x.id === status);
  return c ? c.label : status;
}

// Lo que muestra la tarjeta sobre la fecha límite (el compromiso).
function prodVence(t, hoy, columnas) {
  if (!t.deadline) return null;
  if (!LoopaProduccion.isDay(t.deadline)) return { txt: 'Entrega con fecha inválida', tono: 'alerta' };
  if (LoopaProduccion.isClosed(t, columnas)) return { txt: `Entrega ${prodCorto(t.deadline)}`, tono: 'ok' };
  const d = LoopaProduccion.daysUntil(t.deadline, hoy);
  if (d < 0) return { txt: `Vencida hace ${-d} d`, tono: 'alerta' };
  if (d === 0) return { txt: 'Entrega hoy', tono: 'alerta' };
  if (d <= LoopaProduccion.URGENT_DAYS) return { txt: `Entrega en ${d} d`, tono: 'aviso' };
  return { txt: `Entrega ${prodCorto(t.deadline)}`, tono: '' };
}

// Número de venta: enlace a la venta real, o texto en los datos de ejemplo
// (sus números son ficticios y podrían coincidir con una venta real).
function ProdVenta({ venta, enlazar, onAbrirVenta, conEstado }) {
  if (!venta) return null;
  return (
    <>
      {enlazar
        ? <button className="pr-link" onClick={() => onAbrirVenta(venta.saleId || venta.n)}>#{venta.n}</button>
        : <span className="pr-venta">#{venta.n} · venta de ejemplo</span>}
      {conEstado && venta.cancelled && <span className="pr-venta cancelada" style={{ marginLeft: 8 }}>Venta cancelada · revisar</span>}
    </>
  );
}

function ProdTarjeta({ t, hoy, columnas, onAbrir, compacta }) {
  const pct = LoopaProduccion.progressOf(t);
  const vence = prodVence(t, hoy, columnas);
  const venta = LoopaProduccion.saleLinkOf(t);
  const cerrada = LoopaProduccion.isClosed(t, columnas);
  return (
    <button data-id={t.id} className={`pr-card ${cerrada ? 'cerrada' : ''} ${compacta ? 'compacta' : ''}`} onClick={(e) => onAbrir(t, e.currentTarget)}
      aria-label={`${t.client || 'Sin cliente'}: ${t.title}${vence ? `, ${vence.txt}` : ''}`}>
      <span className="pr-card-cliente">{t.client || 'Sin cliente'}</span>
      {!compacta && <span className="pr-card-titulo">{t.title}</span>}
      {t.checklist.length > 0 && (
        <span className="pr-card-avance" aria-hidden="true"><span style={{ width: `${pct}%` }} /></span>
      )}
      <span className="pr-card-pie">
        {vence && <span className={`pr-vence ${vence.tono}`}>{vence.txt}</span>}
        {venta && <span className={`pr-venta ${venta.cancelled ? 'cancelada' : ''}`}>#{venta.n}</span>}
      </span>
    </button>
  );
}


// Ficha lateral modal: el foco entra al abrir, queda atrapado adentro y
// vuelve a la tarjeta al cerrar (Escape, botón o clic afuera). Con
// `onCambiar` es editable; cada cambio pasa por las reglas del núcleo
// (applyTaskPatch) y un rechazo se muestra acá, sin tocar la tarea.
function ProdDetalle({ t, hoy, columnas, origen, onCerrar, onAbrirVenta, enlazarVentas, onCambiar, onAbrirCliente }) {
  const pct = LoopaProduccion.progressOf(t);
  const venta = LoopaProduccion.saleLinkOf(t);
  const vence = prodVence(t, hoy, columnas);
  const editable = typeof onCambiar === 'function';
  const deVenta = t.sourceSystem === 'loopa';
  const [error, setError] = useState(null);
  const [nuevo, setNuevo] = useState('');
  const panel = useRef(null);
  const cerrarBtn = useRef(null);
  useEffect(() => {
    if (cerrarBtn.current) cerrarBtn.current.focus();
    const onKey = (e) => {
      if (e.key === 'Escape') { e.stopPropagation(); onCerrar(); return; }
      if (e.key !== 'Tab' || !panel.current) return;
      const focos = [...panel.current.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')].filter(el => !el.disabled);
      if (!focos.length) return;
      const primero = focos[0], ultimo = focos[focos.length - 1];
      if (e.shiftKey && document.activeElement === primero) { e.preventDefault(); ultimo.focus(); }
      else if (!e.shiftKey && document.activeElement === ultimo) { e.preventDefault(); primero.focus(); }
    };
    window.addEventListener('keydown', onKey, true);
    return () => {
      window.removeEventListener('keydown', onKey, true);
      // Si la tarjeta se volvió a montar (cambió de columna o de día), se
      // busca por id para devolverle el foco.
      if (origen && document.contains(origen)) origen.focus();
      else {
        const nueva = document.querySelector(`.pr-card[data-id="${CSS.escape(t.id)}"]`);
        if (nueva) nueva.focus();
      }
    };
  }, [onCerrar, origen]);

  const cambiar = (patch) => {
    const r = onCambiar(patch);
    setError(r && !r.ok ? r.error.message : null);
    return r;
  };
  const agregar = () => {
    if (!nuevo.trim()) return;
    const r = cambiar(LoopaProduccion.addChecklistItem(t, nuevo, `c${Date.now().toString(36)}${Math.random().toString(36).slice(2, 5)}`));
    if (r && r.ok) setNuevo('');
  };
  const cols = LoopaProduccion.boardColumns(columnas, [t]);
  const tituloId = `pr-detalle-${t.id}`;

  return (
    <div className="pr-detalle-fondo" onMouseDown={onCerrar}>
      <aside ref={panel} className="pr-detalle" role="dialog" aria-modal="true" aria-labelledby={tituloId} onMouseDown={e => e.stopPropagation()}>
        <div className="pr-detalle-cab">
          <div>
            <div className="page-kicker">{t.client || 'Sin cliente'}</div>
            <div className="pr-detalle-titulo" id={tituloId}>{t.title}</div>
          </div>
          <button ref={cerrarBtn} className="icon-btn" onClick={onCerrar} aria-label="Cerrar"><Icon name="x" size={14} /></button>
        </div>
        {error && <div className="pr-error" role="alert">{error}</div>}
        <dl className="pr-datos">
          <div><dt>Estado</dt><dd>
            {editable
              ? <select className="pr-campo" value={t.status} onChange={e => cambiar({ status: e.target.value })} aria-label="Estado">
                  {cols.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                </select>
              : prodEstadoLabel(t.status, columnas)}
          </dd></div>
          {editable && (
            <div><dt>Prioridad</dt><dd>
              <select className="pr-campo" value={t.priority} onChange={e => cambiar({ priority: e.target.value })} aria-label="Prioridad">
                {LoopaProduccion.PRIORITIES.map(p => <option key={p.id} value={p.id}>{p.label}</option>)}
              </select>
            </dd></div>
          )}
          <div><dt>Día de trabajo</dt><dd>
            {editable
              ? <input className="pr-campo" type="date" value={LoopaProduccion.calendarDateOf(t)} onChange={e => e.target.value && cambiar({ sessionDate: e.target.value })} aria-label="Día de trabajo" style={{ colorScheme: 'dark' }} />
              : prodDiaLabel(LoopaProduccion.calendarDateOf(t))}
          </dd></div>
          <div><dt>Entrega</dt><dd className={vence ? vence.tono : ''}>
            {editable && !deVenta
              ? <input className="pr-campo" type="date" value={t.deadline || ''} onChange={e => cambiar({ deadline: e.target.value })} aria-label="Entrega" style={{ colorScheme: 'dark' }} />
              : (t.deadline ? `${prodDiaLabel(t.deadline)}${vence && vence.tono ? ` · ${vence.txt}` : ''}` : '—')}
            {editable && deVenta && <div className="pr-ayuda">La fija la venta: reprogramar mueve el día de trabajo, no la entrega.</div>}
          </dd></div>
          {t.clientId && onAbrirCliente && (
            <div><dt>Cliente</dt><dd><button className="pr-link" onClick={() => onAbrirCliente(t.clientId)}>Ver ficha de {t.client || 'cliente'}</button></dd></div>
          )}
          {venta && (
            <div><dt>Venta</dt><dd>
              <ProdVenta venta={venta} enlazar={enlazarVentas} onAbrirVenta={onAbrirVenta} conEstado />
            </dd></div>
          )}
        </dl>
        {(t.checklist.length > 0 || editable) && (
          <div className="pr-checklist">
            <div className="pr-checklist-cab"><span>Entregables</span><span className="mono">{pct}%</span></div>
            <ul>
              {t.checklist.map(c => (
                <li key={c.id} className={c.done ? 'hecho' : ''}>
                  {editable
                    ? <label className="pr-check-label">
                        <input type="checkbox" checked={c.done} onChange={() => cambiar(LoopaProduccion.toggleChecklistItem(t, c.id))} />
                        <span>{c.text}</span>
                      </label>
                    : <>
                        <span className="pr-check" aria-hidden="true">{c.done ? <Icon name="check" size={11} /> : null}</span>
                        <span>{c.text}{c.done ? <span className="pr-sr"> (hecho)</span> : null}</span>
                      </>}
                </li>
              ))}
            </ul>
            {editable && (
              <form className="pr-agregar" onSubmit={e => { e.preventDefault(); agregar(); }}>
                <input className="pr-campo" value={nuevo} onChange={e => setNuevo(e.target.value)} placeholder="Agregar entregable…" aria-label="Nuevo entregable" maxLength={200} />
                <button className="btn sm" type="submit" disabled={!nuevo.trim()}>Agregar</button>
              </form>
            )}
          </div>
        )}
        <div className="pr-nota">{editable
          ? 'Datos de ejemplo: los cambios se aplican con las reglas reales, pero no se guardan (se pierden al recargar). La conexión con los datos del equipo llega en la Fase 3.'
          : 'Vista de sólo lectura.'}</div>
      </aside>
    </div>
  );
}

function ProduccionCalendario({ tareas, columnas, hoy, onAbrir }) {
  // Una sola fecha de referencia para mes y semana (como FRAME): cambiar de
  // vista no salta a otro período.
  const [ancla, setAncla] = useState(hoy);
  const [modo, setModo] = useState('mes');
  const normalizadas = useMemo(() => tareas.map(t => LoopaProduccion.normalizeTask(t, hoy)), [tareas, hoy]);
  const porDia = useMemo(() => LoopaProduccion.tasksByDate(normalizadas), [normalizadas]);
  const ay = Number(ancla.slice(0, 4)), am = Number(ancla.slice(5, 7)) - 1;
  const dias = modo === 'mes' ? LoopaProduccion.monthGrid(ay, am) : LoopaProduccion.weekOf(ancla);
  const mesActual = ancla.slice(0, 7);
  const visibles = dias.filter(iso => modo === 'semana' || iso.startsWith(mesActual)).reduce((n, iso) => n + (porDia[iso] || []).length, 0);
  const atencion = normalizadas.filter(t => LoopaProduccion.needsAttention(t, hoy, columnas)).length;

  // Siempre desde el valor vigente (actualización funcional): dos clics
  // seguidos avanzan dos períodos aunque React no haya vuelto a dibujar.
  const mover = (k) => {
    if (modo === 'mes') {
      setAncla(a => {
        const d = new Date(Number(a.slice(0, 4)), Number(a.slice(5, 7)) - 1 + k, 1);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`;
      });
    } else setAncla(a => LoopaProduccion.addDays(a, 7 * k));
  };
  const titulo = modo === 'mes' ? prodMesLabel(ay, am) : prodSemanaLabel(dias);

  return (
    <div className="pr">
      <div className="pr-barra">
        <div className="pr-nav">
          <button className="icon-btn" onClick={() => mover(-1)} aria-label={modo === 'mes' ? 'Mes anterior' : 'Semana anterior'}><Icon name="arrow-l" size={13} /></button>
          <div className="pr-titulo" aria-live="polite">{titulo}</div>
          <button className="icon-btn" onClick={() => mover(1)} aria-label={modo === 'mes' ? 'Mes siguiente' : 'Semana siguiente'}><Icon name="arrow-r" size={13} /></button>
          <button className="btn sm" onClick={() => setAncla(hoy)}>Hoy</button>
        </div>
        <div className="pr-nav">
          {atencion > 0 && <span className="pr-vence alerta">{atencion} con entrega próxima o vencida</span>}
          <div className="pr-modos" role="group" aria-label="Período del calendario">
            <button aria-pressed={modo === 'mes'} className={modo === 'mes' ? 'on' : ''} onClick={() => setModo('mes')}>Mes</button>
            <button aria-pressed={modo === 'semana'} className={modo === 'semana' ? 'on' : ''} onClick={() => setModo('semana')}>Semana</button>
          </div>
        </div>
      </div>
      {visibles === 0 && <div className="pr-vacio">Sin trabajo programado en este {modo === 'mes' ? 'mes' : 'período'}.</div>}
      <div className={`pr-grilla ${modo}`}>
        {PROD_DIAS.map(d => <div key={d} className="pr-dow" aria-hidden="true">{d}</div>)}
        {dias.map(iso => {
          const lista = porDia[iso] || [];
          const fuera = modo === 'mes' && !iso.startsWith(mesActual);
          return (
            <div key={iso} className={`pr-dia ${fuera ? 'fuera' : ''} ${iso === hoy ? 'hoy' : ''} ${lista.length ? 'con' : ''}`}>
              <div className="pr-dia-num"><span className="pr-dia-larga">{prodDiaLabel(iso)}</span><span className="pr-dia-corta">{Number(iso.slice(8))}</span></div>
              {lista.map(t => <ProdTarjeta key={t.id} t={t} hoy={hoy} columnas={columnas} onAbrir={onAbrir} compacta={modo === 'mes' && lista.length > 2} />)}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// Fuente de datos de ejemplo EN MEMORIA: aplica las reglas reales del núcleo
// pero no persiste nada. Mismo contrato que tendrá la fuente real (Fase 3):
// tareas + cambiar(id, patch) → { ok, error }.
function useFuenteDemo(datos) {
  const [tareas, setTareas] = useState(() => (datos ? datos.tareas : []));
  useEffect(() => { setTareas(datos ? datos.tareas : []); }, [datos]);
  const ref = useRef(tareas);
  ref.current = tareas;
  const cambiar = useCallback((id, patch) => {
    const actual = ref.current.find(t => t.id === id);
    if (!actual) return { ok: false, error: { code: 'not_found', message: 'La tarea ya no existe' } };
    const r = LoopaProduccion.applyTaskPatch(LoopaProduccion.normalizeTask(actual, datos.hoy), patch, datos.columnas);
    if (r.ok) {
      const next = ref.current.map(t => (t.id === id ? r.task : t));
      ref.current = next;
      setTareas(next);
    }
    return r;
  }, [datos]);
  // Enlazar una tarea vieja a su ficha de cliente (resolver homónimos).
  const enlazar = useCallback((id, cliente, clientes) => {
    const actual = ref.current.find(t => t.id === id);
    if (!actual) return { ok: false, error: { code: 'not_found', message: 'La tarea ya no existe' } };
    const r = LoopaProduccion.linkTaskToClient(LoopaProduccion.normalizeTask(actual, datos.hoy), cliente, clientes);
    if (r.ok) {
      const next = ref.current.map(t => (t.id === id ? r.task : t));
      ref.current = next;
      setTareas(next);
    }
    return r;
  }, [datos]);
  return { tareas, cambiar, enlazar };
}

// Datos REALES del tablero de producción (tanda 3.5): las tareas y las
// fichas en vivo, como FRAME (tareas por tablero + compartidas), y cada
// cambio se escribe YA con sólo los campos que cambiaron, bajo las reglas,
// más su evento en el historial (como handleUpdateProject de FRAME).
// Firestore muestra el cambio al instante (compensación de latencia) y, si
// las reglas lo rechazan, lo revierte solo: el aviso sale por onError.
// Si una escucha se cae, la edición se frena (los datos dejaron de ser los
// del tablero) hasta recargar.
// `conexion` = { db: Firestore compat, uid } o null.
function useFuenteTablero(conexion, onError) {
  const [estado, setEstado] = useState({ cargando: !!conexion, base: null, error: null });
  const [porTablero, setPorTablero] = useState(null);
  const [compartidas, setCompartidas] = useState([]);
  const [clientesVivos, setClientesVivos] = useState([]);
  const [caida, setCaida] = useState(null);
  const [hoy, setHoy] = useState(() => LoopaProduccionReal.hoyEnTegucigalpa());
  const alError = useRef(onError);
  alError.current = onError;
  const uid = conexion ? conexion.uid : null;
  // «Hoy» cambia a medianoche (Tegucigalpa) aunque la página siga abierta.
  useEffect(() => {
    if (!conexion) return undefined;
    const t = setInterval(() => setHoy(h => { const n = LoopaProduccionReal.hoyEnTegucigalpa(); return n === h ? h : n; }), 60000);
    return () => clearInterval(t);
  }, [uid]);
  useEffect(() => {
    if (!conexion) return undefined;
    const { db } = conexion;
    let vivo = true;
    const dejar = [];
    // Cada lectura con su motivo, en palabras de la pantalla.
    const leer = async (ref, sinPermiso) => {
      try { const d = await ref.get(); return d.exists ? { id: d.id, ...d.data() } : null; }
      catch (e) { throw new Error(e && e.code === 'permission-denied' ? sinPermiso : 'No se pudo leer el tablero. Revisá la conexión.'); }
    };
    const caer = (e) => {
      if (!vivo) return;
      setCaida(e && e.code === 'permission-denied'
        ? 'Perdiste el acceso al tablero de producción. Recargá la página.'
        : 'Se perdió la conexión con el tablero: lo que ves puede estar desactualizado. Recargá la página antes de editar.');
    };
    (async () => {
      const cfg = await leer(db.collection('loopa_config').doc('production'), 'Tu cuenta no tiene acceso a Producción: pedile al admin que te agregue al tablero de producción.');
      const wsId = cfg && typeof cfg.defaultWorkspaceId === 'string' ? cfg.defaultWorkspaceId : null;
      if (!wsId) throw new Error('Falta la configuración de producción (loopa_config/production).');
      const wsRef = db.collection('frame_workspaces').doc(wsId);
      const sinTablero = 'No sos miembro del tablero de producción: pedile al admin que te agregue.';
      const [workspace, columnas, rutina, yo] = await Promise.all([
        leer(wsRef, sinTablero),
        leer(wsRef.collection('config').doc('kanban_columns'), sinTablero),
        leer(wsRef.collection('config').doc('daily_routine'), sinTablero).catch(() => null), // sólo se muestra
        leer(db.collection('frame_users').doc(uid), '').catch(() => null),
      ]);
      if (!workspace) throw new Error('El tablero de producción no existe.');
      if (!vivo) return;
      setEstado(s => ({ ...s, base: { workspace, columnas, rutina, yo: { ...(yo || {}), uid } }, error: null }));
      const plano = (q) => q.docs.map(d => ({ ...d.data(), id: d.id }));
      dejar.push(db.collection('frame_projects').where('workspaceId', '==', wsId)
        .onSnapshot(q => { setPorTablero(plano(q)); setEstado(s => (s.cargando ? { ...s, cargando: false } : s)); }, caer));
      // Las compartidas son un extra (como en FRAME): sin permiso, se ignoran.
      // OJO: el SDK puede entregar primero una foto de su caché y DESPUÉS el
      // rechazo; esa foto vieja pisaría a las tareas en vivo (en la mezcla
      // gana la compartida). Al rechazarse, se vacía.
      dejar.push(db.collection('frame_projects').where('viewerIds', 'array-contains', uid)
        .onSnapshot(q => setCompartidas(plano(q)), e => { setCompartidas([]); if (!e || e.code !== 'permission-denied') caer(e); }));
      dejar.push(db.collection('frame_clients').where('workspaceId', '==', wsId)
        .onSnapshot(q => setClientesVivos(plano(q)), caer));
    })().catch(err => { if (vivo) setEstado({ cargando: false, base: null, error: (err && err.message) || 'No se pudo leer el tablero.' }); });
    return () => { vivo = false; dejar.forEach(f => f()); };
  }, [uid]);
  const datos = useMemo(() => (estado.base && porTablero
    ? LoopaProduccionReal.armarProduccion({ ...estado.base, clientes: clientesVivos, porTablero, compartidas, hoy })
    : null), [estado.base, porTablero, compartidas, clientesVivos, hoy]);
  // La última versión conocida (incluye lo que esta pantalla acaba de
  // escribir): dos cambios seguidos no se pisan entre sí.
  const ref = useRef(datos);
  ref.current = datos;
  const frenado = () => (caida ? { ok: false, error: { code: 'stale', message: caida } } : null);
  const escribir = (id, antes, despues, p) => {
    if (!Object.keys(p).length) return;
    const d = ref.current;
    ref.current = { ...d, tareas: d.tareas.map(t => (t.id === id ? { ...t, ...p } : t)) };
    const tarea = conexion.db.collection('frame_projects').doc(id);
    tarea.update(p).catch(e => alError.current(e));
    const resumen = LoopaProduccionReal.resumenActividad(antes, despues, d.columnas);
    const yo = estado.base && estado.base.yo;
    if (resumen) {
      const ev = { id: `a${Date.now()}${Math.random().toString(36).slice(2, 6)}`, actorId: uid, actorName: (yo && (yo.name || yo.email)) || 'Alguien', summary: resumen, at: new Date().toISOString() };
      tarea.collection('activity').doc(ev.id).set(ev).catch(() => { /* el historial no frena el cambio */ });
    }
  };
  const cambiar = useCallback((id, patch) => {
    const f = frenado();
    if (f) return f;
    const d = ref.current;
    const actual = d && d.tareas.find(t => t.id === id);
    if (!actual) return { ok: false, error: { code: 'not_found', message: 'La tarea ya no existe' } };
    for (const k of ['sessionDate', 'deadline']) {
      if (patch && Object.prototype.hasOwnProperty.call(patch, k) && patch[k] !== '' && !LoopaProduccionReal.fechaEnRango(patch[k])) {
        return { ok: false, error: { code: 'date_incomplete', message: 'Completá la fecha (entre 2000 y 2100).' } };
      }
    }
    const antes = LoopaProduccion.normalizeTask(actual, d.hoy);
    const r = LoopaProduccion.applyTaskPatch(antes, patch, d.columnas);
    if (r.ok) escribir(id, antes, r.task, LoopaProduccionReal.parcheTarea(antes, r.task));
    return r;
  }, [uid, caida, estado.base]);
  const enlazar = useCallback((id, cliente, clientes) => {
    const f = frenado();
    if (f) return f;
    const d = ref.current;
    const actual = d && d.tareas.find(t => t.id === id);
    if (!actual) return { ok: false, error: { code: 'not_found', message: 'La tarea ya no existe' } };
    if (!LoopaProduccionReal.puedeEnlazar(actual, d.workspace.id)) {
      return { ok: false, error: { code: 'link_locked', message: 'Esta tarea no se puede enlazar desde acá (ya tuvo ficha o es de otro tablero).' } };
    }
    const antes = LoopaProduccion.normalizeTask(actual, d.hoy);
    const r = LoopaProduccion.linkTaskToClient(antes, cliente, clientes);
    if (r.ok) escribir(id, antes, r.task, LoopaProduccionReal.parcheEnlace(antes, r.task));
    return r;
  }, [uid, caida, estado.base]);
  return { datos, base: datos ? estado.base : null, cargando: estado.cargando, error: estado.error || caida, tareas: datos ? datos.tareas : [], cambiar, enlazar };
}

// Un error de Firestore al guardar, en palabras de la pantalla.
const prodErrorEscritura = (e) => (e && e.code === 'permission-denied'
  ? 'El tablero no aceptó el cambio (permisos o una regla del tablero): se deshizo.'
  : e && e.code === 'not-found'
    ? 'La tarea ya no existe en el tablero (¿se movió a la papelera en FRAME?).'
    : 'No se pudo guardar el cambio en el tablero. Revisá la conexión.');

// Módulo completo: decide de dónde salen los datos y qué vista se muestra.
// conexion: datos reales del tablero (Firebase) o null (ejemplo / aviso).
function ProduccionModulo({ modo, onAbrirVenta, conexion = null }) {
  const [estado, setEstado] = useState({ cargando: modo === 'demo', datos: null, error: null });
  const [vista, setVista] = useState(() => {
    try { const v = localStorage.getItem('loopa-produccion-vista'); return ['tablero', 'resumen'].includes(v) ? v : 'calendario'; } catch (e) { return 'calendario'; }
  });
  // Rutina de ejemplo en memoria: al cargar se aplica el cambio de día del
  // núcleo (historial + deuda), igual que FRAME al abrir el tablero.
  const [rutina, setRutina] = useState(null);
  // Fichas de cliente de ejemplo (portal publicado o no) y la que está abierta.
  const [clientesDemo, setClientes] = useState([]);
  const [clienteAbierto, setClienteAbierto] = useState(null);
  const [abierta, setAbierta] = useState(null); // { id, el }
  const [aviso, setAviso] = useState(null);
  useEffect(() => {
    if (modo !== 'demo') return undefined;
    let vivo = true;
    fetch(window.LOOPA_DEMO_URL || 'integracion/preview/produccion-demo.json', { cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(datos => { if (vivo) setEstado({ cargando: false, datos, error: null }); })
      .catch(err => { if (vivo) setEstado({ cargando: false, datos: null, error: err.message || 'sin datos' }); });
    return () => { vivo = false; };
  }, [modo]);
  useEffect(() => { try { localStorage.setItem('loopa-produccion-vista', vista); } catch (e) { /* sólo preferencia de vista */ } }, [vista]);
  // Datos reales: con ?produccion=1 y una conexión (Firebase de la fusión).
  const real = modo === '1' && !!conexion;
  const fuenteDemo = useFuenteDemo(estado.datos);
  const fuenteReal = useFuenteTablero(real ? conexion : null, (e) => setAviso(prodErrorEscritura(e)));
  const fuente = real ? fuenteReal : fuenteDemo;
  const base = real ? fuenteReal.datos && fuenteReal.base : estado.datos;
  useEffect(() => {
    const d = real ? fuenteReal.datos : estado.datos;
    if (d) {
      setRutina(LoopaProduccion.routineRollover(d.rutina || {}, d.hoy).doc);
      setClientes(d.clientes || []);
    }
  }, [base]);
  const datos = real ? fuenteReal.datos : estado.datos;
  // Con el tablero real, las fichas llegan en vivo.
  const clientes = real ? (datos ? datos.clientes : []) : clientesDemo;
  const abrir = useCallback((t, el) => { setAviso(null); setAbierta({ id: t.id, el }); }, []);
  // Todo cambio pasa por acá: uno exitoso limpia el aviso de la página.
  const cambiar = useCallback((id, patch) => {
    const r = fuente.cambiar(id, patch);
    if (r.ok) setAviso(null);
    return r;
  }, [fuente.cambiar]);
  const elegirVista = (v) => { setAviso(null); setVista(v); };
  const cerrar = useCallback(() => setAbierta(null), []);
  const tareaAbierta = abierta && datos ? fuente.tareas.find(t => t.id === abierta.id) : null;
  const fichaAbierta = clienteAbierto ? clientes.find(c => c.id === clienteAbierto) : null;
  // Un solo panel a la vez: abrir la ficha cierra la tarea y viceversa.
  // El foco vuelve a quien abrió la ficha: la fila del resumen o, si se
  // llegó desde una tarea, la tarjeta de esa tarea (no un botón de un panel
  // que ya se desmontó).
  const abiertaRef = useRef(null);
  abiertaRef.current = abierta;
  const origenFicha = useRef(null);
  const abrirCliente = useCallback((id) => {
    const a = abiertaRef.current;
    origenFicha.current = a && a.el && document.contains(a.el) ? a.el : document.activeElement;
    setAbierta(null);
    setClienteAbierto(id);
  }, []);
  const cerrarCliente = useCallback(() => setClienteAbierto(null), []);
  const mover = (t, status) => {
    const r = cambiar(t.id, { status });
    if (!r.ok) setAviso(r.error.message);
    return r;
  };

  return (
    <div>
      <div className="page-head">
        <div>
          <div className="page-kicker">Producción</div>
          <div className="page-title">{{ tablero: 'Tablero', resumen: 'Resumen' }[vista] || 'Calendario'}</div>
          <div className="page-desc">{{
            tablero: 'El trabajo por etapa. Mové las tarjetas con las flechas o desde la ficha; pasar a Entregado exige el checklist completo.',
            resumen: 'Cómo viene el trabajo del equipo y la rutina de hoy. Sin importes: lo comercial vive en Ventas y Métricas.',
          }[vista] || 'Una tarjeta por cliente y día, con los entregables de lo vendido. El día ubica el trabajo; la entrega es el compromiso con el cliente.'}</div>
        </div>
        {datos && (
          <div className="pr-modos" role="group" aria-label="Vista de producción">
            <button aria-pressed={vista === 'calendario'} className={vista === 'calendario' ? 'on' : ''} onClick={() => elegirVista('calendario')}>Calendario</button>
            <button aria-pressed={vista === 'tablero'} className={vista === 'tablero' ? 'on' : ''} onClick={() => elegirVista('tablero')}>Tablero</button>
            <button aria-pressed={vista === 'resumen'} className={vista === 'resumen' ? 'on' : ''} onClick={() => elegirVista('resumen')}>Resumen</button>
          </div>
        )}
      </div>
      {modo !== 'demo' && !real && (
        <div className="panel pr-aviso">Producción con los datos del equipo funciona, por ahora, con Firebase emulado en este equipo (<span className="mono">?datos=fusion&amp;servidor=emulador&amp;produccion=1</span>). Para ver el módulo con datos de ejemplo, abrí LOOPA con <span className="mono">?produccion=demo</span>.</div>
      )}
      {real && fuenteReal.cargando && <div className="panel pr-aviso">Cargando el tablero de producción…</div>}
      {real && fuenteReal.error && <div className="panel pr-aviso" role="alert">{fuenteReal.error}</div>}
      {modo === 'demo' && estado.cargando && <div className="panel pr-aviso">Cargando datos de ejemplo…</div>}
      {modo === 'demo' && estado.error && <div className="panel pr-aviso">No se pudieron cargar los datos de ejemplo ({estado.error}). Generalos con <span className="mono">node integracion/preview/generar-demo.cjs</span>.</div>}
      {datos && (
        <>
          {real
            ? <div className="pr-demo">Tablero «{datos.workspace.name}» · hoy = {datos.hoy} · los cambios se guardan en el tablero</div>
            : <div className="pr-demo">Datos de ejemplo generados por el planificador desde ventas ficticias · hoy = {datos.hoy} · los cambios no se guardan</div>}
          {aviso && <div className="pr-error" role="alert">{aviso}</div>}
          {vista === 'calendario' && <ProduccionCalendario tareas={fuente.tareas} columnas={datos.columnas} hoy={datos.hoy} onAbrir={abrir} />}
          {vista === 'tablero' && <ProduccionTablero tareas={fuente.tareas} columnas={datos.columnas} hoy={datos.hoy} onAbrir={abrir} onMover={mover} />}
          {vista === 'resumen' && rutina && (
            <ProduccionResumen tareas={fuente.tareas} columnas={datos.columnas} hoy={datos.hoy} equipo={datos.equipo || []} clientes={clientes} onAbrirCliente={abrirCliente}
              rutina={rutina} onAbrir={abrir}
              onCambiarRutina={real ? () => setAviso('La rutina del día se edita desde FRAME por ahora.') : (fn) => setRutina(d => fn(d))} />
          )}
          {tareaAbierta && (
            <ProdDetalle t={LoopaProduccion.normalizeTask(tareaAbierta, datos.hoy)} origen={abierta.el} hoy={datos.hoy} columnas={datos.columnas}
              enlazarVentas={real} onCerrar={cerrar} onAbrirVenta={(n) => { setAbierta(null); onAbrirVenta(n); }}
              onCambiar={(patch) => cambiar(tareaAbierta.id, patch)}
              onAbrirCliente={clientes.some(c => c.id === tareaAbierta.clientId) ? abrirCliente : null} />
          )}
          {fichaAbierta && (
            <FichaClienteProduccion cliente={fichaAbierta} clientes={clientes} tareas={fuente.tareas} columnas={datos.columnas} hoy={datos.hoy}
              workspace={datos.workspace} onCerrar={cerrarCliente} origen={origenFicha.current}
              onCambiarTarea={cambiar}
              onEnlazarTarea={(id) => fuente.enlazar(id, fichaAbierta, clientes)}
              onPublicar={real ? () => setAviso('Publicar el portal del cliente se hace desde FRAME por ahora.') : (id, on) => setClientes(cs => cs.map(c => (c.id === id ? { ...c, portalPublished: on } : c)))}
              onAbrirTarea={(t) => { setClienteAbierto(null); abrir(t, origenFicha.current); }} />
          )}
        </>
      )}
    </div>
  );
}

// ── módulo: produccion/tablero.jsx ──
// ═══════════════════════════════════════════════════════════════
// LOOPA OS · Producción — tablero por estado (Fase 2, tanda 3)
//
// Columnas = configuración del tablero (kanban_columns). Una tarea con un
// estado que no está en las columnas no desaparece: boardColumns agrega su
// columna al final, como FRAME. Las tarjetas se abren en la ficha editable;
// el estado se cambia ahí o con las flechas de la tarjeta (teclado incluido).
// ═══════════════════════════════════════════════════════════════

function ProduccionTablero({ tareas, columnas, hoy, onAbrir, onMover }) {
  // Tras mover con las flechas la tarjeta se vuelve a montar en otra
  // columna: el foco se lleva a la misma flecha (o a la tarjeta) para que el
  // teclado no pierda el lugar.
  const [foco, setFoco] = useState(null); // { id, lado }
  useEffect(() => {
    if (!foco) return;
    const item = document.querySelector(`.pr-col-item[data-id="${CSS.escape(foco.id)}"]`);
    if (!item) return;
    const flechas = item.querySelectorAll('.pr-mover .icon-btn');
    const preferida = flechas[foco.lado === 'izq' ? 0 : 1];
    const destino = preferida && !preferida.disabled ? preferida : ([...flechas].find(b => !b.disabled) || item.querySelector('.pr-card'));
    if (destino) destino.focus();
    setFoco(null);
  }, [foco, tareas]);
  const mover = (t, status, lado) => { const r = onMover(t, status); if (r && r.ok) setFoco({ id: t.id, lado }); };
  const normalizadas = useMemo(() => tareas.map(t => LoopaProduccion.normalizeTask(t, hoy)), [tareas, hoy]);
  // Lo archivado no ocupa el tablero (FRAME tampoco lo muestra como columna).
  const visibles = normalizadas.filter(t => t.status !== 'archived');
  const cols = LoopaProduccion.boardColumns(columnas, visibles).filter(c => c.id !== 'archived');
  const orden = cols.map(c => c.id);
  return (
    <div className="pr-tablero" role="list" aria-label="Tablero de producción">
      {cols.map((c, i) => {
        const lista = visibles.filter(t => t.status === c.id)
          .sort((a, b) => LoopaProduccion.calendarDateOf(a).localeCompare(LoopaProduccion.calendarDateOf(b)) || a.id.localeCompare(b.id));
        return (
          <section key={c.id} className="pr-col" role="listitem" aria-label={`${c.label}: ${lista.length} tareas`}>
            <header className="pr-col-cab">
              <span>{c.label}{!columnas.some(x => x.id === c.id) ? ' · fuera de las columnas' : ''}</span>
              <span className="mono dim">{lista.length}</span>
            </header>
            <div className="pr-col-lista">
              {lista.length === 0 && <div className="pr-col-vacia">Sin tareas</div>}
              {lista.map(t => (
                <div key={t.id} className="pr-col-item" data-id={t.id}>
                  <ProdTarjeta t={t} hoy={hoy} columnas={columnas} onAbrir={onAbrir} />
                  <div className="pr-mover">
                    <button className="icon-btn" disabled={i === 0} onClick={() => mover(t, orden[i - 1], 'izq')} aria-label={`Mover «${t.title}» a ${i > 0 ? cols[i - 1].label : ''}`}><Icon name="arrow-l" size={11} /></button>
                    <button className="icon-btn" disabled={i === cols.length - 1} onClick={() => mover(t, orden[i + 1], 'der')} aria-label={`Mover «${t.title}» a ${i < cols.length - 1 ? cols[i + 1].label : ''}`}><Icon name="arrow-r" size={11} /></button>
                  </div>
                </div>
              ))}
            </div>
          </section>
        );
      })}
    </div>
  );
}
