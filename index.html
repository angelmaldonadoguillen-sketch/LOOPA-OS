<style>
:root {
  --bg: #14281f;
  --surface: #172e24;
  --card: #1a3329;
  --card-2: #1f3a2f;
  --line: #29473a;
  --line-2: #325243;
  --text: #f3f4e4;
  --muted: #93a89b;
  --dim: #62796b;
  --accent: #e2e58d;
  --accent-ink: #eef0b3;
  --ok: #7BC96F;
  --warn: #E8B547;
  --danger: #E63946;
  --info: #6BA3E0;
  --font-display: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --row-h: 40px;
  /* ── Radios ── */
  --r-xs:  4px;
  --r-sm:  8px;
  --r-md:  12px;
  --r-lg:  16px;
  --r-xl:  20px;
  --r-pill: 999px;
}

* { box-sizing: border-box; cursor: default; user-select: none; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; overflow: hidden; }
body { height: 100vh; height: 100dvh; }

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select, textarea { font-family: inherit; color: inherit; cursor: text; user-select: text; }

.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.display { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.02em; }
.narrow { font-family: var(--font-display); font-weight: 600; }

/* ===================== SHELL ===================== */
.app {
  display: grid;
  grid-template-columns: 224px 1fr;
  height: 100vh;
  height: 100dvh;
}
.app.collapsed { grid-template-columns: 64px 1fr; }

/* ============ SIDEBAR ============ */
.sidebar {
  background: #0f2019;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-brand {
  padding: 18px 18px 14px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 10px;
  transition: background 0.15s;
  user-select: none;
}
.sidebar-brand:hover {
  background: var(--card);
}
.sidebar-brand:active {
  background: var(--card-2);
}
.wordmark {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 22px;
  letter-spacing: -0.02em;
  line-height: 1;
  display: flex;
  align-items: baseline;
  gap: 2px;
}
.wordmark .dot { color: var(--accent); }
.sidebar-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-top: 4px;
}
.sidebar-section {
  padding: 20px 14px 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--dim);
  text-transform: uppercase;
}
.nav {
  padding: 4px 8px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 10px;
  border-radius: var(--r-sm);
  color: var(--muted);
  font-weight: 500;
  font-size: 13px;
  text-align: left;
  letter-spacing: 0.01em;
  position: relative;
}
.nav-item:hover { background: #182f25; color: var(--text); }
.nav-item.active { background: #1a3329; color: var(--text); }
.nav-item.active::before {
  content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; background: var(--accent); border-radius: 0 var(--r-pill) var(--r-pill) 0;
}
.nav-item .num {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--dim);
  margin-left: auto;
}
.nav-item.active .num { color: var(--accent); }

.sidebar-footer {
  margin-top: auto;
  padding: 12px;
  border-top: 1px solid var(--line);
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--dim);
  letter-spacing: 0.08em;
}
.status-dot { display: inline-block; width: 6px; height: 6px; background: var(--ok); margin-right: 6px; vertical-align: middle; border-radius: 50%; box-shadow: 0 0 6px var(--ok); }

/* ============ MAIN AREA ============ */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.topbar {
  height: 56px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 18px;
  flex-shrink: 0;
  background: var(--bg);
}
.breadcrumb {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--muted);
  text-transform: uppercase;
}
.breadcrumb .sep { color: var(--dim); margin: 0 8px; }
.breadcrumb .cur { color: var(--text); }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }

/* ── Stock Bell ── */
.bell-btn {
  position: relative; width: 32px; height: 32px;
  border: 1px solid var(--line-2); border-radius: var(--r-sm);
  background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--dim); font-size: 15px; transition: border-color .15s, color .15s, background .15s;
  flex-shrink: 0;
}
.bell-btn:hover { border-color: var(--warn); color: var(--warn); background: rgba(245,176,65,.06); }
.bell-btn.has-alerts { border-color: rgba(245,176,65,.4); color: var(--warn); }
.bell-badge {
  position: absolute; top: -6px; right: -6px;
  background: var(--accent); color: #fff;
  font-family: var(--font-mono); font-size: 8px; font-weight: 700;
  min-width: 15px; height: 15px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center; padding: 0 3px;
  pointer-events: none; border: 1.5px solid var(--bg);
}
.bell-dropdown {
  position: absolute; top: calc(100% + 10px); right: 0;
  width: 300px; max-height: 380px; overflow-y: auto;
  background: #1a3329; border: 1px solid rgba(245,176,65,.35);
  border-radius: var(--r-md); z-index: 9999;
  box-shadow: 0 8px 32px rgba(0,0,0,.75);
}
.bell-dropdown-head {
  padding: 10px 14px; border-bottom: 1px solid var(--line);
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  color: var(--warn); letter-spacing: .08em; display: flex; align-items: center; gap: 8px;
}
.bell-section {
  padding: 6px 0; border-bottom: 1px solid var(--line);
}
.bell-section:last-child { border-bottom: none; }
.bell-section-label {
  padding: 4px 14px 2px; font-family: var(--font-mono); font-size: 9px;
  color: var(--dim); letter-spacing: .1em;
}
.bell-item {
  padding: 5px 14px; font-family: var(--font-mono); font-size: 10px;
  display: flex; justify-content: space-between; align-items: center;
  gap: 8px; line-height: 1.3;
}
.bell-item:hover { background: rgba(255,255,255,.03); }
.bell-item .bell-item-label { color: var(--muted); flex: 1; }
.bell-item .bell-item-qty { flex-shrink: 0; font-weight: 700; }
.bell-item.agotado .bell-item-qty { color: var(--accent); }
.bell-item.bajo .bell-item-qty { color: var(--warn); }
.bell-empty {
  padding: 18px 14px; font-family: var(--font-mono); font-size: 10px;
  color: var(--dim); text-align: center; letter-spacing: .05em;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.chip .v { color: var(--text); }

.content {
  flex: 1;
  overflow: auto;
  padding: 32px 36px;
}

/* Scrollbar temática — aplica a TODO el sistema (paneles, modales, textareas, etc.) */
* { scrollbar-width: thin; scrollbar-color: #325243 transparent; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: #325243; border-radius: var(--r-pill); }
*::-webkit-scrollbar-thumb:hover { background: #3d5e4e; }
*::-webkit-scrollbar-corner { background: transparent; }

/* ============ PAGE HEADER ============ */
.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 28px;
  padding-bottom: 28px;
  margin-bottom: 32px;
  border-bottom: 1px solid var(--line);
}
.page-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 42px;
  line-height: 0.95;
  letter-spacing: -0.03em;
  margin-bottom: 2px;
}
.page-kicker {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 12px;
}
.page-desc {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.65;
  max-width: 480px;
  margin-top: 10px;
}

/* ============ PANEL ============ */
.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  overflow: hidden;
  position: relative;
}
.panel-head {
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 12px;
}
.panel-title {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text);
}
.panel-title .dim { color: var(--muted); }
.panel-body { padding: 20px; }
.panel-footer { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }

/* crop marks — desactivados con esquinas redondeadas */
.crop .panel-head::before,
.crop .panel-head::after,
.crop::before,
.crop::after { display: none; }

/* ============ BUTTONS ============ */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 16px;
  border: 1px solid var(--line-2);
  border-radius: var(--r-md);
  background: transparent;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
  transition: all 0.12s ease;
}
.btn:hover { border-color: var(--text); background: #1f3a2f; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; border-radius: var(--r-md); }
.btn.primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
.btn.ghost { border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: #1d372c; border-color: var(--line); }
.btn.sm { padding: 6px 12px; font-size: 10px; letter-spacing: 0.1em; border-radius: var(--r-sm); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ============ FORM ============ */
.field { display: flex; flex-direction: column; gap: 8px; }
.field label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.field .req { color: var(--accent); }
.input, .select, .textarea {
  background: #11231b;
  border: 1px solid var(--line-2);
  padding: 12px 14px;
  color: var(--text);
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  width: 100%;
  border-radius: var(--r-sm);
}
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(var(--accent-rgb),.12);
}
.input::placeholder { color: var(--dim); }
.select option, select option { background: #1f3a2f; color: #e3e6d3; }

.segmented {
  display: inline-flex;
  border: 1px solid var(--line-2);
  border-radius: var(--r-sm);
  overflow: hidden;
}
.segmented button {
  padding: 8px 14px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  border-right: 1px solid var(--line-2);
}
.segmented button:last-child { border-right: 0; }
.segmented button:hover { color: var(--text); background: #1f3a2f; }
.segmented button.on { background: var(--text); color: var(--bg); font-weight: 600; }

/* ============ TABLE ============ */
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl thead th {
  text-align: left;
  padding: 10px 14px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
  border-bottom: 1px solid var(--line);
  background: #11231b;
  white-space: nowrap;
}
.tbl tbody td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
.tbl tbody tr { transition: background 0.08s; cursor: pointer; }
.tbl tbody tr:hover { background: #1a3228; }
.tbl tbody tr.selected { background: #1d372c; }
.tbl tbody tr.selected td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
.tbl .num { font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
.tbl .order-n { font-family: var(--font-mono); font-weight: 600; color: var(--text); }

/* ============ BADGES / STATUS ============ */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 500;
  border: 1px solid var(--line-2);
  border-radius: var(--r-pill);
  color: var(--muted);
  white-space: nowrap;
}
.badge .pip { width: 6px; height: 6px; background: var(--muted); border-radius: 50%; }
.badge.sin-empezar { color: #93a89b; border-color: #365646; }
.badge.sin-empezar .pip { background: #93a89b; }
.badge.impresas { color: #E8B547; border-color: #5c4516; }
.badge.impresas .pip { background: #E8B547; }
.badge.preparado { color: #6BA3E0; border-color: #2a4660; }
.badge.preparado .pip { background: #6BA3E0; }
.badge.enviado { color: #B37BE0; border-color: #4a3260; }
.badge.enviado .pip { background: #B37BE0; }
.badge.recibido { color: #7BC96F; border-color: #2e5228; }
.badge.recibido .pip { background: #7BC96F; }
.badge.rebotado { color: #E63946; border-color: #5a1f25; }
.badge.rebotado .pip { background: #E63946; }
.badge.perdido { color: #58705f; border-color: #2c4a3d; }
.badge.perdido .pip { background: #58705f; }

.pay {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.pay.paid { color: var(--ok); }
.pay.pending { color: var(--warn); }

/* ============ KPI ============ */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  margin-bottom: 24px;
}
.kpi {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 22px 20px 26px;
  position: relative;
  overflow: hidden;
}
.kpi .label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.kpi .label .idx { color: var(--dim); }
.kpi .value {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 38px;
  line-height: 1;
  letter-spacing: -0.03em;
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.kpi .unit {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--muted);
  font-weight: 400;
  letter-spacing: 0.04em;
}
.kpi .delta {
  margin-top: 10px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ok);
  display: flex;
  align-items: center;
  gap: 6px;
}
.kpi .delta.neg { color: var(--danger); }
.kpi.accent { background: var(--accent); color: #14281f; }
.kpi.accent .label, .kpi.accent .unit, .kpi.accent .delta { color: rgba(10,10,10,0.7); }

/* ============ STEPPER ============ */
.stepper {
  display: flex;
  gap: 0;
  margin-bottom: 24px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  overflow: hidden;
}
.step {
  flex: 1;
  padding: 14px 18px;
  border-right: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--surface);
  position: relative;
}
.step:last-child { border-right: 0; }
.step .n {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--dim);
  letter-spacing: 0.1em;
  width: 24px;
}
.step .t {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.02em;
  color: var(--muted);
  text-transform: uppercase;
}
.step.active { background: var(--card); }
.step.active::after {
  content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 2px; background: var(--accent);
}
.step.active .n { color: var(--accent); }
.step.active .t { color: var(--text); }
.step.done .n { color: var(--ok); }
.step.done .t { color: var(--muted); }

/* ============ CHART ============ */
.bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 220px; padding: 16px 4px 0; }
.bar-col { flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.bar-col .bar-wrap { flex: 1; width: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; min-height: 0; }
.bar-col .bar {
  background: var(--accent);
  width: 100%;
  min-height: 4px;
  position: relative;
  transition: background 0.1s;
  border-radius: var(--r-xs) var(--r-xs) 0 0;
}
.bar-col .bar.ghost { background: #29473a; }
.bar-col .bar.ghost + .v { color: var(--dim); }
.bar-col:hover .bar { background: var(--accent-ink); }
.bar-col .v {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text);
  font-weight: 500;
}
.bar-col .lbl {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.1em;
  color: var(--muted);
  text-transform: uppercase;
}

/* ============ COLOR/SIZE PICKERS ============ */
.color-swatch-row { display: flex; gap: 12px; flex-wrap: wrap; }
.color-swatch {
  border: 1px solid var(--line);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 160px;
  cursor: pointer;
  background: var(--surface);
  transition: all 0.12s;
  position: relative;
}
.color-swatch:hover { border-color: var(--text); }
.color-swatch.on { border-color: var(--accent); background: var(--card); }
.color-swatch.on::after {
  content: "✓"; position: absolute; top: 8px; right: 10px; color: var(--accent);
  font-family: var(--font-mono); font-size: 14px;
}
.color-swatch .chip-c {
  width: 44px; height: 44px; border: 1px solid var(--line-2);
}
.color-swatch .name {
  font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: -0.01em;
}
.color-swatch .cost {
  font-family: var(--font-mono); font-size: 11px; color: var(--muted);
}

.size-row { display: flex; gap: 8px; flex-wrap: wrap; }
.size-btn {
  width: 60px; height: 60px;
  border: 1px solid var(--line-2);
  background: var(--surface);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 18px;
  color: var(--text);
  transition: all 0.1s;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  padding: 4px 0;
}
.size-btn:hover { border-color: var(--text); }
.size-btn.on { background: var(--accent); border-color: var(--accent); color: #14281f; }
.size-btn.on .mono { color: #14281f !important; }

.catalog-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
  gap: 12px;
}
.catalog-card {
  border: 1px solid var(--line);
  background: var(--surface);
  padding: 10px;
  cursor: pointer;
  transition: all 0.12s;
  position: relative;
}
.catalog-card:hover { border-color: var(--line-2); background: var(--card); }
.catalog-card.on { border-color: var(--accent); }
.catalog-card.on::after {
  content: ""; position: absolute; inset: 0; border: 1px solid var(--accent); pointer-events: none;
}
.thumb {
  aspect-ratio: 1;
  background: #11231b;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 10px;
  overflow: hidden;
  position: relative;
}
.catalog-card .nm {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: -0.005em;
  display: flex; justify-content: space-between; align-items: baseline;
}
.catalog-card .cat-cost {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--muted);
  margin-top: 3px;
}
.sku-tag {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--dim);
  letter-spacing: 0.08em;
}

/* ============ LINE ITEM LIST ============ */
.line-item {
  display: grid;
  grid-template-columns: 48px 1fr auto auto;
  gap: 16px;
  align-items: center;
  padding: 14px 16px;
  border: 1px solid var(--line);
  background: var(--surface);
  margin-bottom: 8px;
}
.line-item .idx {
  font-family: var(--font-mono); font-size: 11px; color: var(--dim); letter-spacing: 0.08em;
}
.line-item .info { display: flex; flex-direction: column; gap: 5px; }
.line-item .pname { font-family: var(--font-display); font-weight: 700; font-size: 14px; }
.line-item .pdetails {
  font-family: var(--font-mono); font-size: 10px; color: var(--muted); letter-spacing: 0.06em;
  text-transform: uppercase;
}
.line-item .cost-breakdown {
  font-family: var(--font-mono);
  font-size: 11px;
  text-align: right;
  color: var(--muted);
  line-height: 1.6;
}
.line-item .cost-breakdown .total { display: block; color: var(--text); font-weight: 600; font-size: 13px; margin-top: 4px; }

/* summary box */
.summary-row {
  display: flex; justify-content: space-between; padding: 10px 0;
  font-family: var(--font-mono); font-size: 12px;
}
.summary-row.big {
  font-family: var(--font-display); font-weight: 700; font-size: 28px; letter-spacing: -0.02em;
  padding: 16px 0; border-top: 1px solid var(--line); margin-top: 10px;
}
.summary-row.big .r { font-family: var(--font-mono); }
.summary-row .l { color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; font-size: 10px; align-self: center; }
.summary-row.big .l { color: var(--text); font-family: var(--font-display); font-size: 13px; letter-spacing: 0.04em; }
.summary-row .r { color: var(--text); }
.summary-row.positive .r { color: var(--ok); }

/* ORDER NUMBER BIG */
.order-hero {
  border: 1px solid var(--accent);
  padding: 30px 32px;
  background: #110808;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  position: relative;
  overflow: hidden;
}
.order-hero::before {
  content: "ORDER"; position: absolute; top: -24px; left: -12px;
  font-family: var(--font-display); font-weight: 700;
  font-size: 180px; color: #180909; letter-spacing: -0.05em; z-index: 0;
}
.order-hero .ord-stack { position: relative; z-index: 1; }
.order-hero .ord-label {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--accent); margin-bottom: 4px;
}
.order-hero .ord-num {
  font-family: var(--font-display); font-weight: 700;
  font-size: 84px; line-height: 0.9; letter-spacing: -0.04em;
}
.order-hero .ord-meta { position: relative; z-index: 1; text-align: right; }
.order-hero .ord-meta .k {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted);
}
.order-hero .ord-meta .v {
  font-family: var(--font-mono); font-size: 13px; color: var(--text); margin-bottom: 8px;
}

/* payment radio list */
.pay-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pay-opt {
  border: 1px solid var(--line);
  background: var(--surface);
  padding: 14px 16px;
  cursor: pointer;
  display: flex; align-items: center; gap: 14px;
  transition: all 0.1s;
}
.pay-opt:hover { border-color: var(--line-2); }
.pay-opt.on { border-color: var(--accent); background: var(--card); }
.pay-opt .radio {
  width: 16px; height: 16px; border: 1px solid var(--line-2); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.pay-opt.on .radio { border-color: var(--accent); }
.pay-opt.on .radio::after { content: ""; width: 8px; height: 8px; background: var(--accent); }
.pay-opt .l {
  font-family: var(--font-display); font-weight: 700; font-size: 13px;
}
.pay-opt .s {
  font-family: var(--font-mono); font-size: 10px; color: var(--muted); letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* filters bar */
.filterbar {
  display: flex; align-items: center; gap: 10px; padding: 0 0 16px;
  flex-wrap: wrap;
}
.filter-group {
  display: flex; align-items: center; gap: 6px;
  border: 1px solid var(--line);
  padding: 6px 10px;
  background: var(--surface);
}
.filter-group .flabel {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--muted);
}
.filter-group select {
  background: transparent; border: 0; color: var(--text); font-family: var(--font-mono);
  font-size: 11px; padding: 2px 4px; outline: none;
}
.filter-group select option {
  background: #1f3a2f; color: #e3e6d3;
}

/* metric sections */
.metrics-grid {
  display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px;
}
.metrics-grid-2 {
  display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
}
.top-list { padding: 0; }
.top-row {
  display: grid; grid-template-columns: 32px 36px 1fr auto; gap: 12px;
  align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line);
}
.top-row:last-child { border-bottom: 0; }
.top-row .rank {
  font-family: var(--font-display); font-weight: 700; font-size: 22px;
  color: var(--accent); letter-spacing: -0.03em;
}
.top-row .th { width: 36px; height: 36px; background: #11231b; border: 1px solid var(--line); overflow: hidden; flex-shrink: 0; }
.top-row .nm { font-family: var(--font-display); font-weight: 600; font-size: 13px; }
.top-row .snm { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
.top-row .v { font-family: var(--font-mono); font-size: 13px; font-weight: 600; }

.channel-row {
  display: grid; grid-template-columns: 120px 1fr auto; gap: 14px;
  align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line);
}
.channel-row:last-child { border-bottom: 0; }
.channel-row .ch {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em;
  text-transform: uppercase;
}
.channel-row .trk {
  height: 8px; background: #11231b; position: relative;
}
.channel-row .trk span {
  position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent);
}
.channel-row .v { font-family: var(--font-mono); font-size: 12px; font-weight: 600; }

/* Tweaks panel */
.tweaks-panel {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 300px;
  background: var(--card);
  border: 1px solid var(--line-2);
  z-index: 100;
  font-family: var(--font-body);
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}
.tweaks-head {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.tweaks-head .t {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: -0.01em;
}
.tweaks-head .x { color: var(--muted); font-family: var(--font-mono); font-size: 14px; }
.tweaks-body { padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.tweak-row { display: flex; flex-direction: column; gap: 6px; }
.tweak-row .lbl {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--muted);
}
.tweak-colors { display: flex; gap: 8px; }
.tweak-col {
  width: 28px; height: 28px; border: 1px solid var(--line-2); cursor: pointer;
}
.tweak-col.on { outline: 2px solid var(--text); outline-offset: 2px; }

/* confirmation check */
.check-anim {
  width: 88px; height: 88px;
  border: 2px solid var(--accent);
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700;
  color: var(--accent); font-size: 44px;
}

/* density */
.density-compact .tbl tbody td { padding: 8px 12px; }
.density-compact .tbl thead th { padding: 8px 12px; }
.density-compact .kpi .value { font-size: 32px; }
.density-compact .kpi { padding: 14px 14px 18px; }

/* misc */
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.accent { color: var(--accent); }
.mt-16 { margin-top: 16px; }
.mt-20 { margin-top: 20px; }
.mt-24 { margin-top: 24px; }
.flex { display: flex; }
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }
.gap-16 { gap: 16px; }
.gap-20 { gap: 20px; }
.grow { flex: 1; }
.between { justify-content: space-between; }
.align-center { align-items: center; }
.nowrap { white-space: nowrap; }
hr.divider { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }

/* little ticker at top */
.ticker {
  height: 34px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 24px;
  font-family: var(--font-body);
  font-size: 11.5px;
  letter-spacing: 0.01em;
  color: var(--muted);
  gap: 26px;
  background: #0f2019;
  overflow: hidden;
  white-space: nowrap;
  flex-shrink: 0;
}
.ticker .item { display: inline-flex; gap: 10px; align-items: center; }
.ticker .item .v { color: var(--text); }
.ticker .sep { color: var(--dim); }

/* flashes */
@keyframes accentFlash { 0%{background:var(--accent); color:#14281f;} 100%{background:var(--card); color:var(--text);} }
.flash { animation: accentFlash 0.6s ease-out; }

/* scanlines on big number */
@keyframes tick { from { opacity: 0.5 } to { opacity: 1 } }
.blink { animation: tick 1.2s ease-in-out infinite alternate; }

/* ── Mobile label in bottom tab (hidden on desktop) ── */
.nav-mobile-label { display: none; font-size: 9px; line-height: 1; letter-spacing: 0.04em; }
/* Mobile-only topbar title */
.topbar-mobile-title { display: none; font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
/* Hide on mobile */
.mob-hide { display: inline-flex; }

/* ============ RESPONSIVE ============ */

/* Tablet: collapse sidebar to icon-only */
@media (max-width: 900px) {
  .app { grid-template-columns: 64px 1fr; }
  .app.collapsed { grid-template-columns: 64px 1fr; }
}

/* Mobile: bottom tab bar layout */
@media (max-width: 640px) {
  /* Viewport height robustness */
  .app, .app.collapsed {
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: 1fr 60px;
    height: 100vh;
    height: 100dvh;
  }

  /* Main area scrolls, takes remaining height */
  .main {
    order: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* Content area scrolls */
  .content {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 14px 24px;
  }

  /* Bottom tab bar */
  .sidebar {
    order: 2;
    flex-direction: row;
    height: 60px;
    min-height: 60px;
    border-right: none;
    border-top: 1px solid var(--line);
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .sidebar::-webkit-scrollbar { display: none; }

  /* Hide desktop-only sidebar parts */
  .sidebar-brand,
  .sidebar-section,
  .sidebar-footer { display: none !important; }

  /* Nav = horizontal tab bar */
  .nav {
    flex-direction: row;
    padding: 0;
    flex: 1;
    gap: 0;
    min-width: 0;
  }

  /* Each tab */
  .nav-item {
    flex: 1;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 6px 4px 4px;
    gap: 4px;
    font-size: 9px;
    min-width: 52px;
    border-radius: 0;
    letter-spacing: 0.02em;
  }
  .nav-item .num { display: none; }
  .nav-item > span:not(.nav-mobile-label) { display: none; } /* hide desktop label */
  .nav-mobile-label { display: block; }

  /* Active tab: top accent line instead of left */
  .nav-item.active::before {
    content: "";
    position: absolute;
    top: 0; left: 10%; right: 10%; bottom: auto;
    width: auto; height: 2px;
    background: var(--accent);
  }

  /* Ticker: hidden on mobile */
  .ticker { display: none; }

  /* Topbar: compact */
  .topbar {
    height: 48px;
    min-height: 48px;
    padding: 0 14px;
    flex-shrink: 0;
  }
  .breadcrumb { display: none; }
  .topbar-mobile-title { display: block; }
  .mob-hide { display: none !important; }

  /* Page header */
  .page-head {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    padding-bottom: 18px;
    margin-bottom: 20px;
  }
  .page-title { font-size: 26px; }
  .page-desc { font-size: 12px; }

  /* Panels */
  .panel-body { padding: 14px; }

  /* Tables: let them scroll */
  .tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tbl th, .tbl td { padding: 8px 10px; font-size: 11px; white-space: nowrap; }

  /* KPI / metrics grids */
  .kpi-grid { grid-template-columns: repeat(2, 1fr) !important; }
  .metrics-grid, .metrics-grid-2 { grid-template-columns: 1fr !important; }

  /* Filter bars */
  .filterbar { gap: 8px; padding: 10px 14px; flex-wrap: wrap; }
  .filter-group { min-width: 120px; }
}

/* Extra small phones */
@media (max-width: 400px) {
  .nav-item { min-width: 44px; padding: 6px 2px 4px; }
  .nav-mobile-label { font-size: 8px; }
  .content { padding: 12px 10px 20px; }
  .page-title { font-size: 22px; }
  .panel-body { padding: 12px; }
}


/* ═════════════ LOOPA OS — agregados sobre la base TOONED ═════════════ */
/* Paleta LOOPA: #14281f verde profundo · #e2e58d lima. Tipografía: solo Montserrat. */
:root {
  --bg: #14281f; --surface: #172e24; --card: #1a3329; --card-2: #1f3a2f;
  --line: #29473a; --line-2: #325243;
  --text: #f3f4e4; --muted: #93a89b; --dim: #62796b;
  --accent-rgb: 226,229,141;
  --on-accent: #14281f;               /* texto sobre el lima */
  --font-display: 'Montserrat', system-ui, sans-serif;
  --font-body: 'Montserrat', system-ui, sans-serif;
  --font-mono: 'Montserrat', system-ui, sans-serif;
}
html, body { font-size: 13.5px; }
.mono, .tbl .num { font-variant-numeric: tabular-nums; }
::selection { background: var(--accent); color: var(--on-accent); }
.step { text-align: left; cursor: pointer; }
.btn { white-space: nowrap; }
.btn.primary, .btn.primary:hover { color: var(--on-accent); }
.bell-badge { color: var(--on-accent); }
.segmented button.on, .chipbtn.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.step:hover:not(.active) { background: #1a3228; }
.order-hero { background: #0f2019; border-color: var(--accent); }
.order-hero::before { content: "LOOPA"; color: rgba(var(--accent-rgb), .06); }
.kpi.accent { color: var(--on-accent); }
.kpi.accent .label, .kpi.accent .unit, .kpi.accent .delta { color: rgba(20,40,31,.7); }
.sidebar-brand { padding: 14px 18px 10px; }
.kpi .value { font-size: clamp(22px, 2.4vw, 36px); flex-wrap: wrap; }
.kpi-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
@media (max-width: 1200px) { .kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* estados del trabajo */
.badge.e-pendiente  { color: #93a89b; border-color: #365646; }       .badge.e-pendiente .pip  { background: #93a89b; }
.badge.e-en-proceso { color: #E8B547; border-color: #5c4516; }    .badge.e-en-proceso .pip { background: #E8B547; }
.badge.e-revision   { color: #6BA3E0; border-color: #2a4660; }    .badge.e-revision .pip   { background: #6BA3E0; }
.badge.e-entregado  { color: #7BC96F; border-color: #2e5228; }    .badge.e-entregado .pip  { background: #7BC96F; }
.badge.e-cancelado  { color: #58705f; border-color: #2c4a3d; text-decoration: line-through; } .badge.e-cancelado .pip { background: #58705f; }
.pay.partial { color: var(--info); }
.tbl .num, .tbl .pay { white-space: nowrap; }

/* inputs */
.input.mini, .select.mini { padding: 8px 10px; font-size: 12px; }
.mini-lbl { display: block; font-family: var(--font-mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-bottom: 5px; }
.fg-input { background: transparent; border: 0; color: var(--text); font-family: var(--font-mono); font-size: 12px; outline: none; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.linkbtn { color: var(--accent); font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 5px; padding: 2px 0; }
.linkbtn:hover { text-decoration: underline; }
.icon-btn { width: 26px; height: 26px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; color: var(--dim); border: 1px solid transparent; flex-shrink: 0; }
.icon-btn:hover { background: #224034; color: var(--text); border-color: var(--line-2); }
.icon-btn.danger:hover { color: var(--danger); border-color: #4a1a1f; background: rgba(230,57,70,.08); }
.icon-btn:disabled { opacity: .3; pointer-events: none; }

/* chips */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chipbtn { padding: 6px 12px; border: 1px solid var(--line-2); border-radius: 999px; font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; transition: all .12s; white-space: nowrap; }
.chipbtn:hover { color: var(--text); border-color: var(--muted); }
.chipbtn.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.srv-chip { display: inline-block; font-family: var(--font-mono); font-size: 10px; letter-spacing: .04em; color: var(--muted); border: 1px solid var(--line-2); border-radius: 6px; padding: 2px 7px; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }
.tag-edit { display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px 4px 12px; border: 1px solid var(--line-2); border-radius: 999px; font-size: 12px; }
.tag-edit button { width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--dim); }
.tag-edit button:hover { background: rgba(230,57,70,.15); color: var(--danger); }

/* buscador grande + dropdown */
.search-big { display: flex; align-items: center; gap: 10px; background: #11231b; border: 1px solid var(--line-2); border-radius: var(--r-md); padding: 0 8px 0 14px; color: var(--muted); transition: border-color .15s, box-shadow .15s; }
.search-big:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .15); color: var(--text); }
.search-big input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; padding: 13px 0; font-size: 14px; color: var(--text); }
.search-big input::placeholder { color: var(--dim); }
.dropdown { position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px; background: #182f25; border: 1px solid var(--accent); border-radius: var(--r-md); z-index: 200; overflow: hidden; max-height: 340px; overflow-y: auto; box-shadow: 0 12px 40px rgba(0,0,0,.7); }
.dropdown-row { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; }
.dropdown-row:last-child { border-bottom: 0; }
.dropdown-row:hover { background: #1f3a2f; }
.dropdown-lbl { font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em; color: var(--dim); padding: 6px 12px; border-bottom: 1px solid var(--line); text-transform: uppercase; background: #11231b; }
.gsearch-wrap { padding: 8px 12px; border-bottom: 1px solid var(--line); position: relative; }
.gsearch { display: flex; align-items: center; gap: 7px; background: #172e24; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 7px 10px; color: var(--dim); }
.gsearch.on { border-color: var(--accent); }
.gsearch input { background: transparent; border: 0; color: var(--text); font-family: var(--font-mono); font-size: 11px; outline: none; width: 100%; }

/* nueva venta */
.nv-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr); gap: 20px; align-items: start; }
.sticky-panel { position: sticky; top: 0; }
.srv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.srv-card { position: relative; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 6px; min-height: 112px; transition: border-color .12s, background .12s, transform .08s; }
.srv-card:hover { border-color: rgba(var(--accent-rgb), .7); background: var(--card); }
.srv-card:active { transform: scale(.98); }
.srv-card.on { border-color: var(--accent); background: rgba(var(--accent-rgb), .06); }
.srv-card.new { border-style: dashed; border-color: var(--accent); background: rgba(var(--accent-rgb), .05); }
.srv-cat { font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); padding-right: 26px; }
.srv-name { font-family: var(--font-display); font-weight: 700; font-size: 14px; line-height: 1.25; letter-spacing: -.01em; overflow-wrap: anywhere; }
.srv-meta { margin-top: auto; display: flex; justify-content: space-between; gap: 8px; font-family: var(--font-mono); font-size: 11px; }
.srv-in { position: absolute; top: 10px; right: 10px; background: var(--accent); color: var(--on-accent); font-family: var(--font-mono); font-size: 10px; font-weight: 700; border-radius: 999px; min-width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; padding: 0 6px; }
.create-box { border: 1px dashed var(--accent); border-radius: var(--r-md); padding: 18px; background: rgba(var(--accent-rgb), .04); }
.ln { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 14px; margin-bottom: 10px; }
.ln-top { display: flex; align-items: flex-start; gap: 10px; }
.ln-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; margin-top: 10px; align-items: end; }
.ln-foot { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: var(--r-sm); overflow: hidden; background: #11231b; }
.qty button { width: 28px; height: 33px; color: var(--muted); display: flex; align-items: center; justify-content: center; }
.qty button:hover { background: #224034; color: var(--text); }
.qty input { width: 34px; text-align: center; background: transparent; border: 0; outline: none; font-family: var(--font-mono); font-size: 12px; color: var(--text); }
.pay-opt { border-radius: var(--r-sm); }
.pay-opt .radio { border-radius: 50%; }
.pay-opt.on .radio::after { border-radius: 50%; }

/* modal */
.modal-back { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.72); display: flex; align-items: flex-start; justify-content: center; padding: 48px 20px; overflow-y: auto; animation: dlgFade .15s ease-out; }
.modal { background: var(--card); border: 1px solid var(--line-2); border-radius: 16px; width: 100%; box-shadow: 0 24px 80px rgba(0,0,0,.7); animation: dlgIn .18s cubic-bezier(.2,0,.1,1); }
.modal-head { display: flex; align-items: flex-start; gap: 12px; padding: 20px 22px; border-bottom: 1px solid var(--line); }
.modal-title { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -.02em; line-height: 1.15; }
.modal-x { margin-left: auto; color: var(--muted); width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.modal-x:hover { background: #224034; color: var(--text); }
.modal-body { padding: 20px 22px; }
.modal-foot { display: flex; gap: 8px; justify-content: flex-end; align-items: center; padding: 16px 22px; border-top: 1px solid var(--line); flex-wrap: wrap; }
@keyframes dlgFade { from { opacity: 0 } to { opacity: 1 } }
@keyframes dlgIn { from { opacity: 0; transform: scale(.96) translateY(8px) } to { opacity: 1; transform: none } }
.kv .k, .fin-strip .k { font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin-bottom: 4px; }
.kv .v { font-size: 14px; font-weight: 600; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding-bottom: 8px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
.fin-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
.fin-strip > div { background: var(--surface); padding: 12px 14px; }
.fin-strip .v { font-family: var(--font-mono); font-size: 14px; font-weight: 600; }
.abono-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
.abono-row:last-child { border-bottom: 0; }
.abono-add { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }

/* popover */
.pick-menu { position: fixed; z-index: 900; background: #1a3329; border: 1px solid var(--line-2); border-radius: 12px; padding: 6px; min-width: 210px; box-shadow: 0 12px 40px rgba(0,0,0,.75); animation: dlgIn .12s ease-out; }
.pick-opt { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; border-radius: 8px; text-align: left; font-size: 12px; }
.pick-opt:hover { background: #224034; }
.pick-opt.on { background: #1f3a2f; }

/* métricas */
.metrics-grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.desglose { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 16px 20px; font-family: var(--font-mono); font-size: 13px; font-weight: 600; }
.desglose .op { color: var(--dim); margin: 0 6px; font-size: 15px; font-weight: 400; }
.desglose .dg { display: flex; flex-direction: column; gap: 2px; padding: 4px 10px; }
.desglose .dg.total { border: 1px solid; border-radius: 8px; padding: 6px 14px; }
.desglose .dl { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); font-weight: 400; }
.channel-row .trk { border-radius: 999px; overflow: hidden; }
.channel-row .ch { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-col .bar { border-radius: 6px 6px 2px 2px; }

/* gastos */
.gasto-form { display: grid; grid-template-columns: 140px 1fr 120px 100px auto; gap: 8px; margin-bottom: 14px; }

/* vacío */
.empty { text-align: center; padding: 48px 24px; }
.empty-ico { width: 52px; height: 52px; border-radius: 14px; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; background: rgba(var(--accent-rgb), .1); color: var(--accent); }
.empty-t { font-family: var(--font-display); font-weight: 700; font-size: 17px; margin-bottom: 6px; }
.empty-d { color: var(--muted); font-size: 13px; line-height: 1.65; max-width: 420px; margin: 0 auto; }

/* toast */
.toast { position: fixed; top: 104px; right: 24px; z-index: 9999; padding: 14px 18px; border-radius: 12px; display: flex; align-items: center; gap: 14px; min-width: 240px; max-width: 400px; font-family: var(--font-mono); font-size: 12px; letter-spacing: .03em; color: var(--text); box-shadow: 0 8px 24px rgba(0,0,0,.45); animation: toastIn .25s ease-out; background: #0A1A0E; border: 1px solid var(--ok); }
.toast.t-info { background: #10221a; border-color: var(--accent); }
.toast.t-warn { background: #1A0A0A; border-color: var(--danger); }
.toast-act { flex-shrink: 0; background: var(--accent); color: var(--on-accent); border-radius: 8px; padding: 6px 12px; font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
@keyframes toastIn { from { transform: translateY(12px); opacity: 0 } to { transform: none; opacity: 1 } }

/* arranque / login */
.boot, .login { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 32px; }
.boot-err { display: flex; align-items: center; gap: 12px; background: #1A0808; border: 1px solid var(--danger); border-radius: 12px; padding: 14px 20px; max-width: 460px; width: 100%; }
.loadbar { height: 100%; background: var(--accent); animation: loadBar 1.4s ease-in-out infinite; }
@keyframes loadBar { 0% { width: 0; margin-left: 0 } 50% { width: 60%; margin-left: 20% } 100% { width: 0; margin-left: 100% } }
.shake { animation: shake .4s ease; }
@keyframes shake { 0%,100% { transform: translateX(0) } 20% { transform: translateX(-8px) } 40% { transform: translateX(8px) } 60% { transform: translateX(-6px) } 80% { transform: translateX(6px) } }
.bell-btn { color: var(--muted); }

/* Tablet: sidebar solo íconos (TOONED ya fija la columna en 64px) */
@media (max-width: 900px) and (min-width: 641px) {
  .nav-item { justify-content: center; }
  .nav-item > span:not(.nav-mobile-label), .gsearch-wrap, .sidebar-footer { display: none !important; }
  .sidebar-brand { justify-content: center !important; padding: 18px 6px 14px; }
  .sidebar-brand svg { height: 34px; width: auto; }
}
@media (max-width: 1100px) {
  .nv-grid, .metrics-grid-3, .metrics-grid { grid-template-columns: 1fr; }
  .sticky-panel { position: static; }
}
@media (max-width: 640px) {
  .grid-2 { grid-template-columns: 1fr; }
  .gasto-form { grid-template-columns: 1fr 1fr !important; }
  .gasto-form > :nth-child(2) { grid-column: 1 / -1; }
  .pay-options { grid-template-columns: 1fr; }
  .stepper .step { padding: 10px; gap: 6px; min-width: 0; }
  .stepper .step .n { width: auto; }
  .stepper .step .t { font-size: 11px; }
  .gsearch-wrap { display: none; }
  .modal-back { padding: 12px; }
  .modal-title { font-size: 18px; }
  .desglose { font-size: 11px; }
  .toast { left: 12px; right: 12px; bottom: 72px; max-width: none; }
  .order-hero { flex-direction: column; align-items: flex-start; gap: 16px; }
  .order-hero .ord-meta { text-align: left; }
  .order-hero .ord-num { font-size: 56px; }
}

/* ═════════════ Estética de marca ═════════════
   El logo es un trazo monolínea, fino y continuo que termina en un punto:
   títulos livianos que cierran con el punto lima, formas redondeadas
   y pesos bajos en las cifras grandes. */
.page-title { font-weight: 300; letter-spacing: -0.025em; line-height: 1.02; }
.page-title::after { content: "."; color: var(--accent); font-weight: 600; }
.page-kicker { letter-spacing: .16em; font-weight: 500; }
.modal-title { font-weight: 400; letter-spacing: -0.015em; }
.kpi .value { font-weight: 300; letter-spacing: -0.02em; }
.kpi .label { font-weight: 500; }
.order-hero .ord-num { font-weight: 300; }
.order-hero::before { content: none; }
.summary-row.big { font-weight: 400; }
.summary-row.big .l { font-weight: 500; }
.top-row .rank { font-weight: 300; }
.empty-t { font-weight: 500; }
.step .t { font-weight: 600; }
.srv-name, .line-item .pname { font-weight: 600; }
.pay-opt .l { font-weight: 600; }
.btn.primary { font-weight: 600; }
.btn { border-radius: 999px; }
.btn.sm { border-radius: 999px; }
.panel, .kpi, .modal { border-radius: 18px; }
.stepper { border-radius: 16px; }
.srv-card, .ln, .create-box, .abono-add, .fin-strip { border-radius: 14px; }
.input, .select, .textarea, .search-big, .qty { border-radius: 12px; }
.filter-group { border-radius: 999px; padding: 6px 14px; }
.pay-opt { border-radius: 12px; }
.sidebar-brand { justify-content: center !important; padding: 26px 24px 22px; }
.nav-item { border-radius: 999px; }
.nav-item.active::before { display: none; }
.nav-item.active { background: rgba(var(--accent-rgb), .1); color: var(--accent); }
.nav-item.active .num { color: var(--accent); }
@media (max-width: 900px) and (min-width: 641px) {
  .sidebar-brand svg { width: auto; height: 34px; }
}
@media (max-width: 640px) {
  .nav-item { border-radius: 0; }
  .nav-item.active { background: transparent; }
}

<script type="text/babel" data-presets="react">
// ═══════════════════════════════════════════════════════════════
// LOOPA OS — sistema de ventas de servicios digitales
// Misma base que TOONED OS (shell, estética, Firebase, diálogos),
// sin inventario: lo que se vende son TIPOS DE SERVICIO reutilizables.
// ═══════════════════════════════════════════════════════════════
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ─── Formato ───────────────────────────────────────────────────
const L = (n) => `${window.__CUR || 'L'} ${Math.round(Number(n) || 0).toLocaleString('es-HN')}`;
const pad2 = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
// Fecha local (no UTC): en Honduras toISOString() ya es "mañana" desde las 6 pm
const today = () => ymd(new Date());
const parseYmd = (s) => { const [y, m, d] = (s || '').split('-').map(Number); return new Date(y || 1970, (m || 1) - 1, d || 1); };
const fmtFecha = (s) => s ? parseYmd(s).toLocaleDateString('es-HN', { day: '2-digit', month: 'short' }) : '—';
const fmtFechaLarga = (s) => s ? parseYmd(s).toLocaleDateString('es-HN', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
const formatTs = (iso) => {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    return `${d.toLocaleDateString('es-HN', { day: '2-digit', month: '2-digit' })} ${d.toLocaleTimeString('es-HN', { hour: '2-digit', minute: '2-digit', hour12: false })}`;
  } catch (e) { return iso.slice(0, 16); }
};
const uid = (p) => `${p}-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`.toUpperCase();
const norm = (s) => (s || '').toString().normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const digits = (s) => (s || '').replace(/\D/g, '');
const num = (v) => { const n = Number(String(v ?? '').replace(/,/g, '')); return isFinite(n) ? n : 0; };

// ─── Catálogos base (editables en Configuración) ───────────────
const ESTADOS = ['pendiente', 'en-proceso', 'revision', 'entregado', 'cancelado'];
const ESTADO_LABELS = {
  'pendiente':  'Pendiente',
  'en-proceso': 'En proceso',
  'revision':   'En revisión',
  'entregado':  'Entregado',
  'cancelado':  'Cancelado',
};
const PAGO_LABELS = { pagado: 'Pagado', anticipo: 'Anticipo', pendiente: 'Por cobrar', 'n/a': 'Anulada' };
const UNIDADES = ['proyecto', 'mes', 'pieza', 'hora', 'campaña', 'paquete'];
const CATEGORIAS_DEFAULT = ['Redes sociales', 'Diseño gráfico', 'Video / Reels', 'Pauta digital', 'Branding', 'Web', 'Fotografía', 'Otro'];
const CANALES_DEFAULT = ['WhatsApp', 'Instagram', 'Facebook', 'TikTok', 'Referido', 'Web', 'Otro'];
const PAY_CONFIG_DEFAULT = [
  { id: 'bac',       label: 'Transf. BAC',        comisionPct: 0 },
  { id: 'atlantida', label: 'Transf. Atlántida',  comisionPct: 0 },
  { id: 'ficohsa',   label: 'Transf. Ficohsa',    comisionPct: 0 },
  { id: 'efectivo',  label: 'Efectivo',           comisionPct: 0 },
  { id: 'tarjeta',   label: 'Tarjeta / link',     comisionPct: 4.5 },
  { id: 'paypal',    label: 'PayPal',             comisionPct: 5.4 },
];
const GASTO_CATS = ['Freelancer', 'Pauta propia', 'Software', 'Equipo', 'Oficina', 'Otro'];
const CONFIG_DEFAULT = { payConfig: PAY_CONFIG_DEFAULT, categorias: CATEGORIAS_DEFAULT, canales: CANALES_DEFAULT, moneda: 'L' };
const GASTOS_DEFAULT = { variables: [], fijos: [] };

// ─── Finanzas de una venta ─────────────────────────────────────
const ventaCosto    = (v) => (v.items || []).reduce((a, i) => a + num(i.costo) * num(i.q || 1), 0);
const ventaCobrado  = (v) => (v.abonos || []).reduce((a, x) => a + num(x.monto), 0);
const ventaSaldo    = (v) => v.estado === 'cancelado' ? 0 : Math.max(0, num(v.total) - ventaCobrado(v));
const ventaComision = (v, payConfig) => {
  const pm = (payConfig || []).find(m => m.id === v.pay);
  return pm && pm.comisionPct ? Math.round(num(v.total) * pm.comisionPct) / 100 : 0;
};
const ventaGanancia = (v, payConfig) => num(v.total) - ventaCosto(v) - ventaComision(v, payConfig);
const pagoEstado = (v) => {
  if (v.estado === 'cancelado') return 'n/a';
  const c = ventaCobrado(v);
  if (c >= num(v.total) - 0.5) return 'pagado';
  if (c > 0) return 'anticipo';
  return 'pendiente';
};
const esActiva = (v) => v.estado !== 'cancelado';
const entregaVencida = (v) => v.entrega && v.entrega < today() && !['entregado', 'cancelado'].includes(v.estado);

// ─── Períodos (Ventas + Métricas) ──────────────────────────────
function periodRange(period, now = new Date()) {
  const y = now.getFullYear(), m = now.getMonth();
  const last = (yy, mm) => new Date(yy, mm + 1, 0).getDate();
  const mesLbl = (d) => d.toLocaleDateString('es-HN', { month: 'long', year: 'numeric' }).toUpperCase();
  if (period === 'hoy') { const t = ymd(now); return { start: t, end: t, months: 1 / 30, label: 'HOY' }; }
  if (period === 'semana') { const d = new Date(now); d.setDate(d.getDate() - 6); return { start: ymd(d), end: ymd(now), months: 7 / 30, label: 'ÚLTIMOS 7 DÍAS' }; }
  if (period === 'mes') return { start: ymd(new Date(y, m, 1)), end: ymd(new Date(y, m, last(y, m))), months: 1, label: mesLbl(now) };
  if (period === 'mes-ant') { const d = new Date(y, m - 1, 1); return { start: ymd(d), end: ymd(new Date(d.getFullYear(), d.getMonth(), last(d.getFullYear(), d.getMonth()))), months: 1, label: mesLbl(d) }; }
  if (period === '30d') { const d = new Date(now); d.setDate(d.getDate() - 29); return { start: ymd(d), end: ymd(now), months: 1, label: 'ÚLTIMOS 30 DÍAS' }; }
  if (period === 'trim') { const qs = Math.floor(m / 3) * 3; return { start: ymd(new Date(y, qs, 1)), end: ymd(new Date(y, qs + 2, last(y, qs + 2))), months: 3, label: `T${qs / 3 + 1} ${y}` }; }
  if (period === 'año') return { start: `${y}-01-01`, end: `${y}-12-31`, months: 12, label: String(y) };
  return { start: '0000-01-01', end: '9999-12-31', months: null, label: 'TODO' };
}
const inRange = (fecha, r) => fecha >= r.start && fecha <= r.end;
const fijoMensual = (fijos) => (fijos || []).filter(f => f.activo !== false).reduce((a, f) => a + num(f.monto), 0);
function gastosEnPeriodo(gastos, r, monthsTodo = 1) {
  const variables = (gastos.variables || []).filter(g => g.fecha && inRange(g.fecha, r)).reduce((a, g) => a + num(g.monto), 0);
  const fijos = fijoMensual(gastos.fijos) * (r.months == null ? monthsTodo : r.months);
  return { variables: Math.round(variables), fijos: Math.round(fijos), total: Math.round(variables + fijos) };
}

// ─── Descargas ─────────────────────────────────────────────────
function downloadFile(name, content, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function downloadCSV(name, headers, rows) {
  const esc = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = '﻿' + [headers.map(esc).join(','), ...rows.map(r => r.map(esc).join(','))].join('\r\n');
  downloadFile(name, csv, 'text/csv;charset=utf-8;');
}

// ─── Persistencia: Firebase si está configurado, si no este navegador ───
const DOC_KEYS = ['ventas', 'clientes', 'servicios', 'config', 'gastos'];
const Store = {
  async loadAll() {
    if (window.USE_FB) {
      const col = window.db.collection('loopa');
      const snaps = await Promise.all(DOC_KEYS.map(k => col.doc(k).get()));
      const out = {};
      DOC_KEYS.forEach((k, i) => { out[k] = snaps[i].exists ? snaps[i].data() : null; });
      return out;
    }
    const out = {};
    DOC_KEYS.forEach(k => {
      try { out[k] = JSON.parse(localStorage.getItem('loopa-' + k) || 'null'); } catch (e) { out[k] = null; }
    });
    return out;
  },
  save(k, data) {
    if (window.USE_FB) return window.db.collection('loopa').doc(k).set(data);
    try { localStorage.setItem('loopa-' + k, JSON.stringify(data)); return Promise.resolve(); }
    catch (e) { return Promise.reject(e); }
  },
};

function PickMenu({ menu, options, onPick, onClose }) {
  useEffect(() => {
    if (!menu) return;
    const c = () => onClose();
    const k = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('mousedown', c);
    window.addEventListener('keydown', k);
    window.addEventListener('scroll', c, true);
    return () => { window.removeEventListener('mousedown', c); window.removeEventListener('keydown', k); window.removeEventListener('scroll', c, true); };
  }, [menu]);
  if (!menu) return null;
  const x = Math.min(menu.x, window.innerWidth - 240);
  const y = Math.min(menu.y, window.innerHeight - (options.length * 40 + 20));
  return (
    <div className="pick-menu" style={{ left: x, top: y }} onMouseDown={e => e.stopPropagation()}>
      {options.map(o => (
        <button key={o.id} className={`pick-opt ${menu.current === o.id ? 'on' : ''}`} onClick={() => onPick(o.id)}>
          {o.node || o.label}
          {menu.current === o.id && <span style={{ marginLeft: 'auto', color: 'var(--accent)' }}><Icon name="check" size={12} /></span>}
        </button>
      ))}
    </div>
  );
}

// ═══════════════════════ NUEVA VENTA ═══════════════════════
function NuevaVenta({ nextN, clientes, servicios, ventas, stats, config, onCreate, onCreateServicio, onUpdateServicio, prefill, onPrefillConsumed, onReset, onOpenVenta }) {
  const { payConfig, canales, categorias } = config;
  const [step, setStep] = useState(prefill?.items?.length ? 2 : 1);
  const [cliente, setCliente] = useState(() => prefill?.cliente || { id: null, nombre: '', empresa: '', telefono: '', email: '', canal: canales[0] || '' });
  const [items, setItems] = useState(() => (prefill?.items || []).map(i => ({ ...i, key: uid('LN') })));
  const [pay, setPay] = useState(() => prefill?.pay && payConfig.some(p => p.id === prefill.pay) ? prefill.pay : (payConfig[0]?.id || ''));
  const [cobro, setCobro] = useState('pagado');
  const [anticipo, setAnticipo] = useState('');
  const [descuento, setDescuento] = useState('');
  const [estado, setEstado] = useState('pendiente');
  const [fecha, setFecha] = useState(today());
  const [entrega, setEntrega] = useState('');
  const [nota, setNota] = useState(prefill?.nota || '');
  const [created, setCreated] = useState(null);

  useEffect(() => { if (prefill && onPrefillConsumed) onPrefillConsumed(); }, []);

  // Tocar un tipo que ya está en la venta suma 1 a la cantidad en vez de duplicar la línea
  const addItem = (s) => setItems(prev => prev.some(i => i.tipoId === s.id)
    ? prev.map(i => i.tipoId === s.id ? { ...i, q: num(i.q) + 1 } : i)
    : [...prev, {
        key: uid('LN'), tipoId: s.id, nombre: s.nombre, categoria: s.categoria, unidad: s.unidad,
        descripcion: s.descripcion || '', precio: String(num(s.precio)), costo: String(num(s.costo)), q: 1,
      }]);
  const updItem = (key, patch) => setItems(prev => prev.map(i => i.key === key ? { ...i, ...patch } : i));
  const delItem = (key) => setItems(prev => prev.filter(i => i.key !== key));

  const totals = useMemo(() => {
    const subtotal = items.reduce((a, i) => a + num(i.precio) * num(i.q), 0);
    const desc = Math.min(subtotal, Math.max(0, num(descuento)));
    const total = subtotal - desc;
    const costo = items.reduce((a, i) => a + num(i.costo) * num(i.q), 0);
    const pm = payConfig.find(m => m.id === pay);
    const comision = pm && pm.comisionPct ? Math.round(total * pm.comisionPct) / 100 : 0;
    const ganancia = total - costo - comision;
    const margen = total > 0 ? (ganancia / total) * 100 : 0;
    const cobrado = cobro === 'pagado' ? total : cobro === 'anticipo' ? Math.min(total, Math.max(0, num(anticipo))) : 0;
    return { subtotal, desc, total, costo, comision, ganancia, margen, cobrado, saldo: total - cobrado };
  }, [items, descuento, pay, payConfig, cobro, anticipo]);

  const canProceed = {
    1: cliente.nombre.trim().length > 0,
    2: items.length > 0 && items.every(i => num(i.q) > 0),
    3: !!pay && (cobro !== 'anticipo' || totals.cobrado > 0),
  };

  const confirm = () => {
    const venta = {
      n: nextN, fecha,
      cliente: cliente.nombre.trim(), empresa: (cliente.empresa || '').trim(),
      telefono: (cliente.telefono || '').trim(), email: (cliente.email || '').trim(), canal: cliente.canal,
      items: items.map(({ key, ...r }) => ({ ...r, precio: num(r.precio), costo: num(r.costo), q: num(r.q) || 1, descripcion: (r.descripcion || '').trim() })),
      subtotal: totals.subtotal, descuento: totals.desc, total: totals.total,
      pay, abonos: totals.cobrado > 0 ? [{ id: uid('AB'), fecha, monto: totals.cobrado, metodo: pay }] : [],
      estado, entrega, nota: nota.trim(), creado: new Date().toISOString(),
    };
    const saved = onCreate(venta, cliente);
    setCreated(saved || venta);
  };

  if (created) return <VentaCreada venta={created} payConfig={payConfig} onReset={onReset} onOpen={() => onOpenVenta(created.n)} />;

  const steps = [{ n: '01', t: 'Cliente' }, { n: '02', t: 'Servicios' }, { n: '03', t: 'Cobro' }];

  return (
    <div>
      <div className="page-head">
        <div>
          <div className="page-kicker">Registro</div>
          <div className="page-title">Nueva venta</div>
          <div className="page-desc">Elegí el cliente, sumá servicios desde tus tipos guardados (o creá uno nuevo al vuelo) y registrá el cobro.</div>
        </div>
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
          <span className="chip">CORRELATIVO <span className="v mono">#{nextN}</span></span>
          <span className="chip">SERVICIOS <span className="v mono">{pad2(items.length)}</span></span>
          <span className="chip">TOTAL <span className="v mono">{L(totals.total)}</span></span>
        </div>
      </div>

      <div className="stepper">
        {steps.map((s, idx) => (
          <button key={s.n} className={`step ${step === idx + 1 ? 'active' : step > idx + 1 ? 'done' : ''}`}
            onClick={() => { if (idx + 1 < step || [1, 2, 3].slice(0, idx).every(k => canProceed[k])) setStep(idx + 1); }}>
            <div className="n mono">{step > idx + 1 ? '✓' : s.n}</div>
            <div className="t">{s.t}</div>
          </button>
        ))}
      </div>

      {step === 1 && <PasoCliente cliente={cliente} setCliente={setCliente} clientes={clientes} ventas={ventas} canales={canales} nota={nota} setNota={setNota} />}
      {step === 2 && (
        <PasoServicios servicios={servicios} stats={stats} categorias={categorias} items={items}
          addItem={addItem} updItem={updItem} delItem={delItem} totals={totals}
          onCreateServicio={onCreateServicio} onUpdateServicio={onUpdateServicio} />
      )}
      {step === 3 && (
        <PasoCobro payConfig={payConfig} pay={pay} setPay={setPay} cobro={cobro} setCobro={setCobro}
          anticipo={anticipo} setAnticipo={setAnticipo} descuento={descuento} setDescuento={setDescuento}
          estado={estado} setEstado={setEstado} fecha={fecha} setFecha={setFecha} entrega={entrega} setEntrega={setEntrega}
          totals={totals} items={items} cliente={cliente} nextN={nextN} canConfirm={canProceed[3]} onConfirm={confirm} />
      )}

      <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 24, gap: 10 }}>
        <button className="btn ghost" disabled={step === 1} onClick={() => setStep(s => s - 1)}>
          <Icon name="arrow-l" size={13} /> Volver
        </button>
        {step < 3 && (
          <button className="btn primary" disabled={!canProceed[step]} onClick={() => setStep(s => s + 1)}>
            Continuar <Icon name="arrow-r" size={13} />
          </button>
        )}
      </div>
    </div>
  );
}

function PasoCliente({ cliente, setCliente, clientes, ventas, canales, nota, setNota }) {
  const [q, setQ] = useState('');
  const [open, setOpen] = useState(false);
  const nq = norm(q);
  const matches = nq.length >= 2
    ? clientes.filter(c => norm(`${c.nombre} ${c.empresa} ${c.email}`).includes(nq) || (digits(q).length >= 3 && digits(c.telefono).includes(digits(q)))).slice(0, 6)
    : [];
  const compras = (id) => ventas.filter(v => v.clienteId === id && esActiva(v)).length;
  const apply = (c) => {
    setCliente({ id: c.id, nombre: c.nombre || '', empresa: c.empresa || '', telefono: c.telefono || '', email: c.email || '', canal: c.canal || cliente.canal });
    setQ(''); setOpen(false);
  };
  const set = (k) => (e) => setCliente(c => ({ ...c, [k]: e.target.value }));
  const recientes = useMemo(() => {
    const seen = new Set(); const out = [];
    for (const v of ventas) { if (v.clienteId && !seen.has(v.clienteId)) { seen.add(v.clienteId); const c = clientes.find(x => x.id === v.clienteId); if (c) out.push(c); } if (out.length >= 6) break; }
    return out;
  }, [ventas, clientes]);

  return (
    <div className="panel crop">
      <div className="panel-head">
        <div className="panel-title">PASO 01 · <span className="dim">CLIENTE</span></div>
        {cliente.id && (
          <span className="mono" style={{ marginLeft: 'auto', fontSize: 10, letterSpacing: '0.1em', color: 'var(--accent)' }}>
            ● CLIENTE EXISTENTE · {compras(cliente.id)} COMPRA{compras(cliente.id) === 1 ? '' : 'S'}
          </span>
        )}
      </div>
      <div className="panel-body">
        <div className="field" style={{ position: 'relative', marginBottom: 18 }}>
          <label>Buscar cliente guardado</label>
          <div className="search-big">
            <Icon name="search" size={15} />
            <input placeholder="Nombre, empresa, teléfono o email…" value={q}
              onFocus={() => setOpen(true)} onBlur={() => setTimeout(() => setOpen(false), 160)}
              onChange={e => { setQ(e.target.value); setOpen(true); }} />
            {cliente.id && (
              <button className="btn sm ghost" onClick={() => setCliente({ id: null, nombre: '', empresa: '', telefono: '', email: '', canal: canales[0] || '' })}>
                <Icon name="plus" size={11} /> Cliente nuevo
              </button>
            )}
          </div>
          {open && matches.length > 0 && (
            <div className="dropdown">
              {matches.map(c => (
                <div key={c.id} className="dropdown-row" onMouseDown={() => apply(c)}>
                  <div style={{ minWidth: 0 }}>
                    <div style={{ fontWeight: 600 }}>{c.nombre}{c.empresa && <span className="muted" style={{ fontWeight: 400 }}> · {c.empresa}</span>}</div>
                    <div className="mono dim" style={{ fontSize: 10, marginTop: 2 }}>{[c.telefono, c.email].filter(Boolean).join(' · ') || 'Sin contacto'}</div>
                  </div>
                  <span className="mono" style={{ fontSize: 10, color: 'var(--accent)' }}>{compras(c.id)} compras</span>
                </div>
              ))}
            </div>
          )}
          {!cliente.id && !q && recientes.length > 0 && (
            <div className="chips" style={{ marginTop: 10 }}>
              <span className="mono dim" style={{ fontSize: 10, letterSpacing: '0.1em', alignSelf: 'center', marginRight: 4 }}>RECIENTES</span>
              {recientes.map(c => <button key={c.id} className="chipbtn" onClick={() => apply(c)}>{c.nombre}</button>)}
            </div>
          )}
        </div>

        <div className="grid-2">
          <div className="field">
            <label>Nombre del cliente <span className="req">*</span></label>
            <input className="input" placeholder="Ej. Andrea Mejía" value={cliente.nombre} onChange={set('nombre')} />
          </div>
          <div className="field">
            <label>Empresa / marca</label>
            <input className="input" placeholder="Ej. Café Montaña" value={cliente.empresa} onChange={set('empresa')} />
          </div>

function PasoServicios({ servicios, stats, categorias, items, addItem, updItem, delItem, totals, onCreateServicio, onUpdateServicio }) {
  const [q, setQ] = useState('');
  const [cat, setCat] = useState('all');
  const [draft, setDraft] = useState(null);
  const searchRef = useRef(null);

  const activos = servicios.filter(s => s.activo !== false);
  const nq = norm(q);
  const list = activos
    .filter(s => (cat === 'all' || s.categoria === cat) && (!nq || norm(`${s.nombre} ${s.categoria} ${s.descripcion}`).includes(nq)))
    .sort((a, b) => (stats[b.id]?.q || 0) - (stats[a.id]?.q || 0) || a.nombre.localeCompare(b.nombre));
  const exact = nq ? servicios.find(s => norm(s.nombre) === nq) : null;
  const catsConServicios = categorias.filter(c => activos.some(s => s.categoria === c));
  const enCarrito = (id) => items.filter(i => i.tipoId === id).reduce((a, i) => a + num(i.q), 0);

  const startCreate = () => setDraft({
    nombre: q.trim(), categoria: cat !== 'all' ? cat : (categorias[0] || 'Otro'),
    unidad: 'proyecto', precio: '', costo: '', descripcion: '',
  });
  const saveDraft = () => {
    if (!draft.nombre.trim()) return;
    const s = onCreateServicio(draft);
    addItem(s); setDraft(null); setQ('');
    setTimeout(() => searchRef.current?.focus({ preventScroll: true }), 50);
  };
  const onKey = (e) => {
    if (e.key !== 'Enter' || !nq) return;
    if (exact && exact.activo !== false) { addItem(exact); setQ(''); }
    else if (list.length === 1) { addItem(list[0]); setQ(''); }
    else if (!exact) startCreate();
  };

  return (
    <div className="nv-grid">
      {/* Catálogo de tipos */}
      <div className="panel crop">
        <div className="panel-head">
          <div className="panel-title">PASO 02 · <span className="dim">TIPOS DE SERVICIO</span></div>
          <span className="mono dim" style={{ marginLeft: 'auto', fontSize: 10, letterSpacing: '0.1em' }}>{activos.length} GUARDADOS</span>
        </div>
        <div className="panel-body">
          <div className="search-big" style={{ marginBottom: 12 }}>
            <Icon name="search" size={15} />
            <input ref={searchRef} autoFocus placeholder="Buscar un tipo… o escribir uno nuevo y Enter" value={q}
              onChange={e => { setQ(e.target.value); setDraft(null); }} onKeyDown={onKey} />
            {q && <button className="btn sm ghost" onClick={() => setQ('')}><Icon name="x" size={11} /></button>}
          </div>
          {catsConServicios.length > 1 && (
            <div className="chips" style={{ marginBottom: 16 }}>
              <button className={`chipbtn ${cat === 'all' ? 'on' : ''}`} onClick={() => setCat('all')}>Todos</button>
              {catsConServicios.map(c => <button key={c} className={`chipbtn ${cat === c ? 'on' : ''}`} onClick={() => setCat(c)}>{c}</button>)}
            </div>
          )}

          {draft ? (
            <NuevoTipoInline draft={draft} setDraft={setDraft} categorias={categorias} onSave={saveDraft} onCancel={() => setDraft(null)} />
          ) : (
            <div className="srv-grid">
              {nq && !exact && (
                <button className="srv-card new" onClick={startCreate}>
                  <div className="srv-cat">Nuevo tipo</div>
                  <div className="srv-name">+ Crear «{q.trim()}»</div>
                  <div className="srv-meta"><span className="dim">Queda guardado para la próxima</span></div>
                </button>
              )}
              {exact && exact.activo === false && (
                <button className="srv-card new" onClick={() => { onUpdateServicio(exact.id, { activo: true }); addItem(exact); setQ(''); }}>
                  <div className="srv-cat">Archivado</div>
                  <div className="srv-name">Reactivar «{exact.nombre}» y agregar</div>
                  <div className="srv-meta"><span>{L(exact.precio)}</span></div>
                </button>
              )}
              {list.map(s => {
                const st = stats[s.id]; const n = enCarrito(s.id);
                return (
                  <button key={s.id} className={`srv-card ${n ? 'on' : ''}`} onClick={() => addItem(s)} title={s.descripcion || s.nombre}>
                    {n > 0 && <span className="srv-in">{n}</span>}
                    <div className="srv-cat">{s.categoria}</div>
                    <div className="srv-name">{s.nombre}</div>
                    <div className="srv-meta">
                      <span>{L(s.precio)}<span className="dim"> / {s.unidad}</span></span>
                      {st?.q > 0 && <span className="dim">×{st.q}</span>}
                    </div>
                  </button>
                );
              })}
              {!nq && activos.length === 0 && (
                <div style={{ gridColumn: '1 / -1' }}>
                  <Empty icon="tag" title="Todavía no hay tipos de servicio">
                    Escribí arriba el nombre del primero —por ejemplo <b>Manejo de redes · plan mensual</b>— y presioná Enter.
                    Queda guardado y la próxima vez que lo vendas solo lo tocás.
                  </Empty>
                </div>
              )}
              {nq && list.length === 0 && exact && exact.activo !== false && null}
            </div>
          )}
        </div>
      </div>

      {/* Líneas de la venta */}
      <div className="panel crop sticky-panel">
        <div className="panel-head">
          <div className="panel-title">EN ESTA VENTA · <span className="dim">{items.length} LÍNEA{items.length === 1 ? '' : 'S'}</span></div>
        </div>
        <div className="panel-body">
          {items.length === 0 ? (
            <div className="mono dim" style={{ fontSize: 11, textAlign: 'center', padding: '28px 8px', lineHeight: 1.8 }}>
              Tocá un tipo de servicio para agregarlo.<br />Precio, cantidad y detalle se ajustan acá.
            </div>
          ) : items.map((i, idx) => {
            const base = servicios.find(s => s.id === i.tipoId);
            const precioCambio = base && num(i.precio) !== num(base.precio);
            return (
              <div className="ln" key={i.key}>
                <div className="ln-top">
                  <span className="mono dim" style={{ fontSize: 11, paddingTop: 2 }}>{pad2(idx + 1)}</span>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div className="srv-name">{i.nombre}</div>
                    <div className="mono dim" style={{ fontSize: 9, letterSpacing: '0.12em', textTransform: 'uppercase', marginTop: 2 }}>{i.categoria} · por {i.unidad}</div>
                  </div>
                  <button className="icon-btn danger" onClick={() => delItem(i.key)} title="Quitar"><Icon name="x" size={12} /></button>
                </div>
                <textarea className="input mini" rows="1" style={{ marginTop: 10, resize: 'vertical' }}
                  placeholder="Detalle de esta venta (ej. 12 posts + 4 reels · octubre)"
                  value={i.descripcion} onChange={e => updItem(i.key, { descripcion: e.target.value })} />
                <div className="ln-grid">
                  <label><span className="mini-lbl">Precio</span><input className="input mini mono" inputMode="decimal" value={i.precio} onChange={e => updItem(i.key, { precio: e.target.value })} /></label>
                  <label><span className="mini-lbl">Cant.</span><Qty value={i.q} onChange={q => updItem(i.key, { q })} /></label>
                  <label><span className="mini-lbl">Costo</span><input className="input mini mono" inputMode="decimal" value={i.costo} onChange={e => updItem(i.key, { costo: e.target.value })} title="Lo que te cuesta a vos: freelancer, pauta, licencias…" /></label>
                </div>
                <div className="ln-foot">
                  {precioCambio && (
                    <button className="linkbtn" onClick={() => onUpdateServicio(base.id, { precio: num(i.precio) })}>
                      Guardar {L(i.precio)} como precio base
                    </button>
                  )}
                  <span className="mono" style={{ marginLeft: 'auto', fontWeight: 600 }}>{L(num(i.precio) * num(i.q))}</span>
                </div>
              </div>
            );
          })}
          {items.length > 0 && (
            <div className="summary-row big" style={{ fontSize: 22 }}>
              <span className="l">Subtotal</span><span className="r">{L(totals.subtotal)}</span>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}
