.pay-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.metrics-grid {

}
.metrics-grid-2 {

}
.top-list { padding: 0; }
.top-row {
  display: grid; grid-template-columns: 32px 36px 1fr auto; gap: 12px;
  align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line);
}
.top-row:last-child { border-bottom: 0; }
.top-row .rank {
  font-family: var(--font-display); font-weight: 500; font-size: var(--fs-l);
  color: var(--accent); letter-spacing: -0.03em;
}
.top-row .th { width: 36px; height: 36px; background: #0e0e0d; border: 1px solid var(--line); overflow: hidden; flex-shrink: 0; }
.top-row .nm { font-family: var(--font-display); font-weight: 500; font-size: var(--fs-m); }
.top-row .snm { font-family: var(--font-mono); font-size: var(--fs-s); color: var(--muted); }
.top-row .v { font-family: var(--font-mono); font-size: var(--fs-m); font-weight: 500; }
.channel-row {
  display: grid; grid-template-columns: 120px 1fr auto; gap: 14px;
  align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line);
}
.channel-row:last-child { border-bottom: 0; }
.channel-row .ch {
  font-family: var(--font-mono); font-size: var(--fs-s); letter-spacing: 0.1em;
  text-transform: uppercase;
}
.channel-row .trk {
  height: 8px; background: #0e0e0d; position: relative;
}
.channel-row .trk span {
  position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent);
}
.channel-row .v { font-family: var(--font-mono); font-size: var(--fs-s); font-weight: 500; }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.accent { color: var(--accent); }
.flex { display: flex; }
.nowrap { white-space: nowrap; }
hr.divider { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
.ticker {
  height: 34px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 24px;
  font-family: var(--font-body);
  font-size: var(--fs-s);
  letter-spacing: 0.01em;
  color: var(--muted);
  gap: 26px;
  background: #0c0c0b;
  overflow: hidden;
  white-space: nowrap;
  flex-shrink: 0;
}
.ticker .item { display: inline-flex; gap: 10px; align-items: center; }
.ticker .item .v { color: var(--text); }
.ticker .sep { color: var(--dim); }
.nav-mobile-label { display: none; font-size: var(--fs-s); line-height: 1; letter-spacing: 0.04em; }
.topbar-mobile-title { display: none; font-family: var(--font-display); font-weight: 500; font-size: var(--fs-m); letter-spacing: -0.01em; }
.mob-hide { display: inline-flex; }
@media (max-width: 900px) {
.app { grid-template-columns: 64px 1fr; }
.app.collapsed { grid-template-columns: 64px 1fr; }
}
@media (max-width: 640px) {
.app, .app.collapsed {
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: 1fr 60px;
    height: 100vh;
    height: 100dvh;
  }
.main {
    order: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
.content {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 14px 24px;
  }
.sidebar {
    order: 2;
    flex-direction: row;
    height: 60px;
    min-height: 60px;
    border-right: none;
    border-top: 1px solid var(--line);
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
.sidebar::-webkit-scrollbar { display: none; }
.sidebar-brand { display: none !important; }
.nav {
    flex-direction: row;
    padding: 0;
    flex: 1;
    gap: 0;
    min-width: 0;
  }
.nav-item {
    flex: 1;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 6px 4px 4px;
    gap: 4px;
    font-size: var(--fs-s);
    min-width: 52px;
    border-radius: 0;
    letter-spacing: 0.02em;
  }
.nav-item .num { display: none; }
.nav-item > span:not(.nav-mobile-label) { display: none; }
.nav-mobile-label { display: block; }
.nav-item.active::before {
    content: "";
    position: absolute;
    top: 0; left: 10%; right: 10%; bottom: auto;
    width: auto; height: 2px;
    background: var(--accent);
  }
.ticker { display: none; }
.topbar {
    height: 48px;
    min-height: 48px;
    padding: 0 14px;
    flex-shrink: 0;
  }
.breadcrumb { display: none; }
.topbar-mobile-title { display: block; }
.mob-hide { display: none !important; }
.page-head {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    padding-bottom: 18px;
    margin-bottom: 20px;
  }
.page-title { font-size: var(--fs-l); }
.page-desc { font-size: var(--fs-s); }
.panel-body { padding: 14px; }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tbl th, .tbl td { padding: 8px 10px; font-size: var(--fs-s); white-space: nowrap; }
.kpi-grid { grid-template-columns: repeat(2, 1fr) !important; }
.metrics-grid, .metrics-grid-2 { grid-template-columns: 1fr !important; }
.filterbar { gap: 8px; padding: 10px 14px; flex-wrap: wrap; }
.filter-group { min-width: 120px; }
}
@media (max-width: 400px) {
.nav-item { min-width: 44px; padding: 6px 2px 4px; }
.nav-mobile-label { font-size: var(--fs-s); }
.content { padding: 12px 10px 20px; }
.page-title { font-size: var(--fs-l); }
.panel-body { padding: 12px; }
}

:root {
  --bg: #121211; --surface: #171716; --card: #1b1b1a; --card-2: #20201f;
  --line: #2a2a28; --line-2: #343432;
  --text: #f4f4f1; --muted: #9a9a95; --dim: #63635f;
  --accent-rgb: 244,244,241;

  --font-display: 'Manrope', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --font-body: 'Manrope', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --font-mono: 'Manrope', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --fs-s: 12px;   
  --fs-m: 14px;   
  --fs-l: 30px;   
}
html, body { font-size: var(--fs-m); }
b, strong { font-weight: 500; }
.mono, .tbl .num { font-variant-numeric: tabular-nums; }
::selection { background: var(--accent); color: var(--on-accent); }
.step { text-align: left; cursor: pointer; }
.btn { white-space: nowrap; }
.btn.primary, .btn.primary:hover { color: var(--on-accent); }
.bell-badge { color: var(--on-accent); }
.segmented button.on, .chipbtn.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.step:hover:not(.active) { background: #1a1a19; }
.order-hero { background: #0c0c0b; border-color: var(--accent); }
.order-hero::before { content: "LOOPA"; color: rgba(var(--accent-rgb), .06); }
.kpi.accent { color: var(--on-accent); }
.kpi.accent .label, .kpi.accent .unit, .kpi.accent .delta { color: rgba(18,18,17,.65); }
.sidebar-brand { padding: 14px 18px 10px; }
.kpi .value { font-size: var(--fs-l); flex-wrap: wrap; }
.kpi-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
@media (max-width: 1200px) {
.kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

.ficha-duracion { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ficha-duracion .qty { width: 120px; }
.ficha-vacio { display: flex; flex-direction: column; gap: 6px; padding: 18px; border: 1px dashed var(--line-2); border-radius: 14px; color: var(--muted); font-size: var(--fs-s); line-height: 1.6; }
.ficha-vacio b { color: var(--text); font-size: var(--fs-m); font-weight: 500; }
.ficha-vacio i { font-style: normal; color: var(--text); }
.ficha-entregables, .ficha-proceso, .ficha-costos { display: flex; flex-direction: column; gap: 10px; }
.ficha-ent { position: relative; padding: 14px 14px 12px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.ficha-ent::before { content: ''; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: var(--tono); }
.ficha-ent-top { display: flex; align-items: center; gap: 10px; }
.ficha-ent-dot { width: 10px; height: 10px; flex: 0 0 10px; border-radius: 50%; background: var(--tono); box-shadow: 0 0 0 4px color-mix(in srgb, var(--tono) 18%, transparent); }
.ficha-ent-nombre { flex: 1; min-width: 0; font-weight: 500; }
.ficha-ent-detalle { width: 100%; margin-top: 8px; }
.ficha-ent-tipo { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
.ficha-tipo { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line); border-radius: var(--r-pill); background: transparent; color: var(--dim); font: inherit; font-size: 11px; cursor: pointer; }
.ficha-tipo:hover { color: var(--text); }
.ficha-tipo.on { color: var(--text); border-color: var(--line-2); background: var(--surface-2, #1c1c1b); }
.ficha-tipo i { font-style: normal; color: var(--dim); }
.ficha-tipo-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.ficha-item-info { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; color: var(--muted); font-size: var(--fs-s); }
.ficha-item-info span:first-child { color: var(--text); }
.ficha-ent-patron { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.ficha-patron-tipos { display: flex; flex-wrap: wrap; gap: 6px; }
.ficha-patron { padding: 6px 12px; border: 1px solid var(--line); border-radius: var(--r-pill); background: transparent; color: var(--muted); font: inherit; font-size: var(--fs-s); cursor: pointer; }
.ficha-patron:hover { color: var(--text); border-color: var(--line-2); }
.ficha-patron.on { color: #121211; background: var(--tono); border-color: var(--tono); }
.ficha-patron-params { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; }
.ficha-patron-params .qty { width: 112px; }
.ficha-patron-params label > .input { width: 112px; }
.ficha-dias { display: flex; gap: 4px; }
.ficha-dias button { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--muted); font: inherit; font-size: var(--fs-s); cursor: pointer; }
.ficha-dias button.on { background: var(--tono); border-color: var(--tono); color: #121211; font-weight: 600; }
.ficha-ent-resumen { color: var(--dim); font-size: var(--fs-s); letter-spacing: .06em; }
.ficha-add { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border: 1px dashed var(--line-2); border-radius: var(--r-pill); background: transparent; color: var(--muted); font: inherit; font-size: var(--fs-s); cursor: pointer; }
.ficha-add:hover { color: var(--accent); border-color: var(--accent); }
.ficha-linea { margin-top: 16px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: color-mix(in srgb, var(--surface) 70%, transparent); }
.ficha-linea-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.ficha-linea-head .mono { color: var(--muted); font-size: var(--fs-s); }
.ficha-linea-fila { display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 12px; height: 26px; }
.ficha-linea-nombre { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); font-size: var(--fs-s); }
.ficha-linea-pista { position: relative; height: 2px; background: var(--line); border-radius: 2px; }
.ficha-linea-punto { position: absolute; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: var(--tono); box-shadow: 0 0 0 3px var(--bg); }
.ficha-linea-eje { display: grid; grid-template-columns: 120px 1fr auto 1fr auto; gap: 12px; margin-top: 10px; color: var(--dim); font-size: var(--fs-s); letter-spacing: .08em; text-transform: uppercase; }
.ficha-linea-eje span:nth-child(1) { grid-column: 2; }
.ficha-linea-eje span:nth-child(2) { grid-column: 3; }
.ficha-linea-eje span:nth-child(3) { grid-column: 5; }
.ficha-pasos { display: flex; flex-direction: column; gap: 8px; counter-reset: paso; }
.ficha-paso { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; }
.ficha-paso-n { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border: 1px solid var(--line-2); border-radius: 50%; color: var(--accent); font-size: var(--fs-s); }
.ficha-paso-acc { display: flex; gap: 4px; }
.ficha-sugeridos { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; }
.ficha-costo { display: grid; grid-template-columns: 1fr 120px auto; gap: 8px; align-items: center; }
.ficha-utilidad { margin-top: 16px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.ficha-util-filas > div, .ficha-util-total > div:first-child { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.ficha-util-filas { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; background: var(--surface); }
.ficha-util-filas span { color: var(--muted); font-size: var(--fs-s); }
.ficha-util-total { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px; border-top: 1px solid var(--line); }
.ficha-util-total > div:first-child { flex-direction: column; align-items: flex-start; gap: 4px; }
.ficha-util-total span { color: var(--dim); font-family: var(--font-mono); font-size: var(--fs-s); letter-spacing: .1em; text-transform: uppercase; }
.ficha-util-total b { font-size: 22px; font-weight: 500; }
.ficha-util-margen { font-size: 30px; letter-spacing: -.02em; }
.ficha-util-total.ok .ficha-util-margen { color: var(--ok); }
.ficha-util-total.warn .ficha-util-margen { color: var(--warn); }
.ficha-util-total.bad .ficha-util-margen { color: var(--danger); }
.ficha-util-barra { height: 4px; background: var(--line); }
.ficha-util-barra span { display: block; height: 100%; background: var(--muted); transition: width .3s ease; }
.ficha-util-barra span.ok { background: var(--ok); }
.ficha-util-barra span.warn { background: var(--warn); }
.ficha-util-barra span.bad { background: var(--danger); }
.ficha-estado { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: var(--r-pill); font-size: var(--fs-s); white-space: nowrap; }
.ficha-estado.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.ficha-estado.falta { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); }
.srv-incluye { margin-top: 6px; color: var(--muted); font-size: var(--fs-s); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-align: left; }
.nv-incompletos { margin-top: 14px; color: var(--dim); font-size: var(--fs-s); }
.nv-rango { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
.nv-rango .input { width: 150px; }
.nv-rango-flecha { color: var(--dim); padding-bottom: 9px; }
.nv-rango-fin { padding: 8px 0; font-size: var(--fs-s); }
.nv-rango-n { margin-left: auto; padding-bottom: 9px; color: var(--accent); font-size: var(--fs-s); letter-spacing: .06em; }
.ln .ficha-linea { margin-top: 12px; padding: 12px; }
.ln .ficha-linea-fila { grid-template-columns: 90px 1fr; }
.ln .ficha-linea-eje { grid-template-columns: 90px 1fr auto 1fr auto; }
@media (max-width: 640px) {
.service-form-stepper .step:not(.active) .t { display: none; }
.service-form-stepper .step.active { flex: 2.4; }
.ficha-linea-fila { grid-template-columns: 80px 1fr; }
.ficha-linea-eje { grid-template-columns: 80px 1fr auto 1fr auto; }
.ficha-costo { grid-template-columns: 1fr 90px auto; }

.estudio {
    
    --bg:        #131315;
    --surface:   #1c1c1e;
    --surface-2: #252527;
    --surface-3: #2f2f31;

    
    --text:       #ffffff;
    --text-dim:   rgba(235, 235, 245, 0.60);
    --text-muted: rgba(235, 235, 245, 0.30);
    --text-faint: rgba(235, 235, 245, 0.18);

    
    --border:   rgba(84, 84, 88, 0.40);
    --border-2: rgba(84, 84, 88, 0.60);
    --hairline: rgba(255, 255, 255, 0.055);

    
    --accent:      #f5f5f7;
    --accent-dim:  #d0d0d5;
    --accent-on:   #0a0a0b;
    --accent-soft: rgba(255, 255, 255, 0.13);
    --accent-soft-weak: rgba(255, 255, 255, 0.07);
    --accent-border: rgba(255, 255, 255, 0.38);
    --focus-ring: rgba(245, 245, 247, 0.72);
    
    --resource-blue:    #39a8ff;
    --resource-violet:  #aa72ff;
    --resource-teal:    #2ed6c2;
    --resource-coral:   #ff6262;
    --resource-pink:    #ff62a3;
    --resource-green:   #25e27a;
    --resource-orange:  #ffd23f;
    --resource-neutral: #a6a2ad;
    --resource-on:      #0a0a0b;
    --danger:        #ff453a;
    --danger-on:     #0a0a0b;
    --danger-soft:   rgba(255, 69, 58, 0.10);
    --danger-soft-2: rgba(255, 69, 58, 0.20);
    --warn:          #ffd426;
    --warn-soft:     rgba(255, 212, 38, 0.10);
    --warn-soft-2:   rgba(255, 212, 38, 0.20);
    --info:        #64d2ff;
    --color-scheme: dark;

    
    --t-10: 10px;  --t-11: 11px;  --t-12: 12px;  --t-13: 13px;
    --t-15: 15px;  --t-17: 17px;  --t-22: 22px;  --t-26: 26px;  --t-30: 30px;

    
    --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-xl: 20px;

    
    --ease: cubic-bezier(.32, .72, 0, 1);
  }
.estudio { color-scheme: var(--color-scheme); }
.estudio { height: 100%; }
@media (prefers-reduced-motion: reduce) {
.estudio *, .estudio *::before, .estudio *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
}
.estudio button, .estudio a, .estudio [role="button"], .estudio input, .estudio select, .estudio textarea { touch-action: manipulation; }
.estudio .overflow-y-auto { overscroll-behavior: contain; }
.estudio {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif;
    font-size: var(--t-13);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    
    font-feature-settings: 'kern' 1, 'cv05' 1, 'cv08' 1;
    font-optical-sizing: auto;
    overflow: hidden;
  }
.estudio .surf {
    background: var(--surface-2);
    border-radius: var(--r-md);
    box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.06);
  }
.estudio .surf-panel {
    background: var(--surface);
    border-radius: var(--r-lg);
    box-shadow:
      inset 0 0.5px 0 rgba(255, 255, 255, 0.08),
      0 12px 32px -12px rgba(0, 0, 0, 0.7);
  }
.estudio .surf-float {
    background: rgba(37, 37, 39, 0.86);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border-radius: var(--r-lg);
    box-shadow:
      inset 0 0.5px 0 rgba(255, 255, 255, 0.09),
      0 16px 40px -12px rgba(0, 0, 0, 0.8);
  }
.estudio .surf-hover { transition: background-color 280ms var(--ease), transform 280ms var(--ease); }
.estudio .surf-hover:hover { background: var(--surface-3); }
.estudio .field {
    background: var(--surface-3);
    border-radius: var(--r-sm);
    color: var(--text);
    box-shadow: inset 0 0.5px 0 rgba(0, 0, 0, 0.3);
    transition: box-shadow 180ms var(--ease);
  }
.estudio .field:focus, .estudio .field:focus-within {
    
    box-shadow: inset 0 0 0 1.5px var(--accent-soft), inset 0 0 0 1px var(--accent);
    outline: none;
  }
.estudio .hair { border-bottom: 0.5px solid var(--border); }
.estudio .hair-t { border-top:    0.5px solid var(--border); }
.estudio .tnum, .estudio .font-mono { font-variant-numeric: tabular-nums; }
.estudio .font-display { letter-spacing: -0.021em; }
.estudio h1, .estudio .t-30 { letter-spacing: -0.028em; }
.estudio .ui-section-label {
    color: var(--text-dim);
    font-size: var(--t-12);
    font-weight: 600;
    letter-spacing: -0.006em;
    line-height: 1.25;
  }
.estudio ::-webkit-scrollbar { width: 10px; height: 10px; }
.estudio ::-webkit-scrollbar-track { background: transparent; }
.estudio ::-webkit-scrollbar-thumb { background: #2a2a31; border-radius: 10px; border: 2px solid var(--bg); }
.estudio ::-webkit-scrollbar-thumb:hover { background: #3a3a44; }
.estudio .surface { background: var(--surface); }
.estudio .surface-2 { background: var(--surface-2); }
.estudio .border-app { border-color: var(--border); }
.estudio ::selection { background: var(--accent); color: var(--accent-on); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideRight { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

.estudio .muro-enlace { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
.estudio .muro-enlace-info { flex: 1; min-width: 0; }
.estudio .muro-enlace-host { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.estudio .muro-enlace-url { margin-top: 1px; font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.estudio .muro-lista { padding: 10px 12px; }
.estudio .muro-fila { display: flex; align-items: center; gap: 4px; }
.estudio .muro-fila input[type="checkbox"] { flex: none; width: 15px; height: 15px; margin-right: 2px; accent-color: var(--accent); cursor: pointer; }
.estudio .muro-fila.hecho .muro-campo { text-decoration: line-through; color: var(--text-muted); }
.estudio .muro-paleta { display: grid; grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); gap: 10px; padding: 12px; }
.estudio .muro-hex { width: 100%; padding: 1px 2px; border-radius: 4px; font-size: 10px; font-variant-numeric: tabular-nums; color: var(--text-dim) !important; text-transform: uppercase; }
.estudio .muro-hex:hover, .estudio .muro-hex:focus { background: var(--surface-2) !important; color: var(--text) !important; }
.estudio .muro-color { position: relative; display: flex; flex-direction: column; gap: 4px; font-size: 10px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.estudio .muro-muestra { display: block; height: 52px; border-radius: 8px; border: 1px solid var(--border-2); cursor: pointer; overflow: hidden; }
.estudio .muro-muestra input { width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.estudio .muro .muro-color .muro-x { position: absolute; top: 3px; right: 3px; padding: 2px; background: rgba(0, 0, 0, .55); color: #fff; opacity: 0; }
.estudio .muro-color:hover .muro-x, .estudio .muro-color .muro-x:focus-visible { opacity: 1; }
.estudio .muro .muro-color-mas { display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 8px; border: 1px dashed var(--border-2); color: var(--text-dim); }
.estudio .muro .muro-color-mas:hover { color: var(--text); border-color: var(--text-dim); }
.estudio .muro .muro-quitar-linea { position: absolute; z-index: 4; display: flex; padding: 5px; border-radius: 50%; background: var(--accent); color: var(--accent-on, #181817); }
.estudio .muro-marco { position: absolute; border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); pointer-events: none; }
.estudio .muro-bienvenida { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); width: min(380px, calc(100% - 140px)); text-align: center; color: var(--text-dim); pointer-events: none; }
.estudio .muro-bienvenida strong { display: block; margin-bottom: 8px; font-size: 18px; font-weight: 600; color: var(--text); }
.estudio .muro-bienvenida p { margin: 0; line-height: 1.55; }
.estudio .muro-bienvenida .muro-pista { margin-top: 8px; font-size: 11px; color: var(--text-muted); }
.estudio .muro-flotante { cursor: default; }
.estudio .muro-barra { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); z-index: 6; display: flex; flex-direction: column; gap: 2px; padding: 6px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border-2); box-shadow: 0 10px 28px rgba(0, 0, 0, .3); }
.estudio .muro .muro-barra button { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 54px; padding: 8px 2px 6px; border-radius: 11px; font-size: 10px; color: var(--text-dim); }
.estudio .muro .muro-barra button:hover { background: var(--surface-3); color: var(--text); }
.estudio .muro-zoom { position: absolute; right: 14px; bottom: 14px; z-index: 6; display: flex; align-items: center; gap: 1px; padding: 4px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border-2); box-shadow: 0 10px 28px rgba(0, 0, 0, .3); }
.estudio .muro .muro-zoom button { display: flex; align-items: center; justify-content: center; min-width: 30px; height: 30px; padding: 0 5px; border-radius: 8px; color: var(--text-dim); }
.estudio .muro .muro-zoom button:not(:disabled):hover { background: var(--surface-3); color: var(--text); }
.estudio .muro .muro-zoom .muro-pct { min-width: 46px; font-size: 11px; font-variant-numeric: tabular-nums; }
.estudio .muro-zoom i { width: 1px; height: 18px; margin: 0 4px; background: var(--border-2); }
.estudio .muro-menu { position: absolute; z-index: 7; width: 170px; padding: 5px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border-2); box-shadow: 0 14px 36px rgba(0, 0, 0, .4); }
.estudio .muro-menu-t { padding: 5px 8px 6px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); }
.estudio .muro .muro-menu button { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 8px; border-radius: 7px; text-align: left; }
.estudio .muro .muro-menu button:hover { background: var(--surface-3); }
.estudio .muro-aviso { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 12; max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 10px; background: var(--surface-3); border: 1px solid var(--border-2); box-shadow: 0 10px 28px rgba(0, 0, 0, .35); font-size: 12px; }
.estudio .muro-foto-grande { position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 32px; background: rgba(0, 0, 0, .88); }
.estudio .muro-foto-grande img { max-width: 100%; max-height: 100%; border-radius: 10px; }
.estudio .muro-cta { display: flex; align-items: center; gap: 18px; width: 100%; padding: 14px 18px; border: 1px solid var(--border-2); border-radius: 14px; background: var(--surface-2); text-align: left; cursor: pointer; transition: border-color .15s, background .15s; }
.estudio .muro-cta:hover { border-color: var(--accent); background: var(--surface-3); }
.estudio .muro-cta-t { display: block; font-size: 15px; font-weight: 600; color: var(--text); }
.estudio .muro-cta-s { display: block; margin-top: 2px; font-size: 12px; color: var(--text-dim); }
.estudio .muro-cta-txt { flex: 1; min-width: 0; }
.estudio .muro-cta-ir { flex: none; color: var(--text-dim); transition: transform .15s; }
.estudio .muro-cta:hover .muro-cta-ir { transform: translateX(3px); color: var(--text); }
.estudio .muro-mini { flex: none; width: 120px; height: 64px; border-radius: 8px; background: var(--surface); }
.estudio .muro-mini rect { fill: var(--surface-3); stroke: var(--border-2); vector-effect: non-scaling-stroke; }
.estudio .muro-mini path { fill: none; stroke: var(--text-muted); stroke-width: 1; vector-effect: non-scaling-stroke; }
.estudio .ficha-grupo { display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; align-items: start; }
@media (min-width: 1280px) {
.estudio .ficha-grupo { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
.estudio .muro-cabecera { gap: 10px; padding: 0 8px; }
.estudio .muro-nombre span { display: none; }
.estudio .muro-barra { left: 8px; right: 8px; top: auto; bottom: 56px; transform: none; flex-direction: row; overflow-x: auto; justify-content: space-between; }
.estudio .muro .muro-barra button { flex: 1 0 50px; }
.estudio .muro-zoom { right: 8px; bottom: 8px; }
.estudio .muro-mini { width: 84px; height: 52px; }
.estudio .muro-cta { gap: 12px; padding: 12px; }
.estudio .muro-bienvenida { width: calc(100% - 40px); top: 34%; }
}
.estudio {
  --bg: #121211; --surface: #171716; --surface-2: #1e1e1d; --surface-3: #252524;
  --text: #f4f4f1; --text-dim: rgba(244,244,241,0.64); --text-muted: rgba(244,244,241,0.40); --text-faint: rgba(244,244,241,0.20);
  --border: #2a2a28; --border-2: #343432; --hairline: rgba(244,244,241,0.06);
  --accent: #f4f4f1; --accent-dim: #d6d6d1; --accent-on: #121211;
  --accent-soft: rgba(244,244,241,0.12); --accent-soft-weak: rgba(244,244,241,0.06); --accent-border: rgba(244,244,241,0.34); --focus-ring: rgba(244,244,241,0.6);
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 20px;
  font-family: 'Manrope', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 13px; color: var(--text); background: var(--bg);
}
.estudio button, .estudio input, .estudio select, .estudio textarea { font-family: inherit; }
